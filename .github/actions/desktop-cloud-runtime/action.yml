name: Exact Cloud runtime for Desktop
description: Verify private source-labelled images and start only this job's Compose runtime.
inputs:
  cloud-source-sha:
    description: Optional immutable Cloud commit; must accompany image-run-id.
    default: ''
  image-run-id:
    description: Successful private CI archive or published self-hosted release build for cloud-source-sha.
    default: ''
  desktop-ref:
    description: Immutable Desktop commit when exact Cloud mode is selected.
    required: true
  desktop-path:
    description: Existing Desktop checkout.
    default: '.'
  cloud-path:
    description: Existing Cloud checkout with the job's Compose environment prepared.
    default: AppFlowy-Cloud-Premium
  github-token:
    description: Existing token with read access to private Client source and Cloud Actions/artifacts.
    required: true
  timeline:
    description: Build the commercial self-hosted Cloud flavor from the verified source.
    default: 'false'
  allow-equivalent-shared-source:
    description: Allow a different Server pin only when both immutable server-owned Client exports are identical.
    default: 'false'
outputs:
  enabled:
    description: True only when the exact runtime has passed all provenance checks.
    value: ${{ steps.request.outputs.enabled }}
runs:
  using: composite
  steps:
    - name: Resolve the immutable generated Client pin
      id: pins
      shell: bash
      env:
        CLOUD_SHA: ${{ inputs.cloud-source-sha }}
        IMAGE_RUN: ${{ inputs.image-run-id }}
        DESKTOP_REF: ${{ inputs.desktop-ref }}
        DESKTOP_PATH: ${{ inputs.desktop-path }}
        ALLOW_EQUIVALENT_SOURCE: ${{ inputs.allow-equivalent-shared-source }}
      run: |
        args=()
        if [[ "$ALLOW_EQUIVALENT_SOURCE" == true ]]; then args+=(--allow-equivalent-shared-source); fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/desktop_cloud_runtime.py" pins \
          --cloud-source-sha "$CLOUD_SHA" --image-run-id "$IMAGE_RUN" \
          --desktop-ref "$DESKTOP_REF" --desktop "$DESKTOP_PATH" "${args[@]}"
    - name: Check out the exact shared Server source for equivalence verification
      if: steps.pins.outputs.shared-cloud-sha != ''
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-Cloud-Premium
        ref: ${{ steps.pins.outputs.shared-cloud-sha }}
        path: .ci-shared-cloud
        token: ${{ inputs.github-token }}
        persist-credentials: false
    - name: Check out the exact generated Client source
      if: steps.pins.outputs.client-sha != ''
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-Client
        ref: ${{ steps.pins.outputs.client-sha }}
        path: .ci-generated-client
        token: ${{ inputs.github-token }}
        persist-credentials: false
    - name: Install the source-pinned generated protobuf formatter
      if: steps.pins.outputs.client-sha != ''
      shell: bash
      env:
        CLOUD_PATH: ${{ inputs.cloud-path }}
      run: |
        toolchain=$(python3 - <<'PYTHON'
        import os, re, subprocess, tomllib
        source = subprocess.check_output(["git", "show", "HEAD:rust-toolchain.toml"], cwd=os.environ["CLOUD_PATH"], text=True)
        channel = tomllib.loads(source)["toolchain"]["channel"]
        if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", channel):
            raise SystemExit("Generated Client verification requires the source's pinned Rust toolchain")
        print(channel)
        PYTHON
        )
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt
    - name: Verify paired inputs, source checkouts and private build
      id: request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CLOUD_SHA: ${{ inputs.cloud-source-sha }}
        IMAGE_RUN: ${{ inputs.image-run-id }}
        DESKTOP_REF: ${{ inputs.desktop-ref }}
        DESKTOP_PATH: ${{ inputs.desktop-path }}
        CLOUD_PATH: ${{ inputs.cloud-path }}
        ALLOW_EQUIVALENT_SOURCE: ${{ inputs.allow-equivalent-shared-source }}
      run: |
        args=()
        if [[ "$ALLOW_EQUIVALENT_SOURCE" == true ]]; then args+=(--allow-equivalent-shared-source); fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/desktop_cloud_runtime.py" request \
          --cloud-source-sha "$CLOUD_SHA" --image-run-id "$IMAGE_RUN" \
          --desktop-ref "$DESKTOP_REF" --desktop "$DESKTOP_PATH" --cloud "$CLOUD_PATH" \
          --client "$GITHUB_WORKSPACE/.ci-generated-client" \
          --shared-cloud "$GITHUB_WORKSPACE/.ci-shared-cloud" \
          --manifest "$RUNNER_TEMP/desktop-cloud-manifest.json" "${args[@]}"
    - name: Download the verified private image set
      if: steps.request.outputs.enabled == 'true' && steps.request.outputs.image-kind == 'ci_archive'
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.request.outputs.artifact-ids }}
        merge-multiple: true
        path: ${{ runner.temp }}/desktop-cloud-images
        repository: AppFlowy-IO/AppFlowy-Cloud-Premium
        run-id: ${{ inputs.image-run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Verify images, pull dependencies and start the pinned runtime
      if: steps.request.outputs.enabled == 'true'
      shell: bash
      env:
        CLOUD_PATH: ${{ inputs.cloud-path }}
        TIMELINE: ${{ inputs.timeline }}
      run: |
        args=()
        if [[ "$TIMELINE" == true ]]; then args+=(--timeline); fi
        python3 "$GITHUB_ACTION_PATH/../../scripts/desktop_cloud_runtime.py" start \
          --cloud "$CLOUD_PATH" --archives "$RUNNER_TEMP/desktop-cloud-images" \
          --manifest "$RUNNER_TEMP/desktop-cloud-manifest.json" "${args[@]}"
