name: AppFlowy-Cloud Integration Tests
run-name: >-
  [ci source=${{ github.event_name == 'pull_request' && github.repository || 'AppFlowy-IO/AppFlowy-Cloud-Premium' }}
  pr=${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number || 'none' }}
  parent=${{ github.event.client_payload.parent_run_id && format('{0}-{1}', github.event.client_payload.parent_run_id, github.event.client_payload.parent_run_attempt) || 'none' }}]
  ${{ github.workflow }}

on:
  repository_dispatch:
    types: [cloud-premium-integration-ci]
  workflow_dispatch:
    inputs:
      pr_ref:
        description: Branch or commit to test (e.g. refs/pull/123/head)
        required: true
        type: string
      image_builder:
        description: Where to build images and Cloud test binaries (tests run on GitHub)
        type: choice
        required: true
        default: self-hosted
        options:
          - self-hosted
          - github-hosted
      pr_number:
        description: PR number (optional, for concurrency grouping)
        required: false
        type: string
      execution_id:
        description: Execution identifier (optional, forwarded to webhook)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.pr_number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  LOCALHOST_URL: http://localhost
  LOCALHOST_WS: ws://localhost/ws/v1
  LOCALHOST_WS_V2: ws://localhost/ws/v2
  # Root MCP integration tests run on the Actions runner and call the
  # standalone appflowy_mcp service exposed by docker-compose-ci.yml.
  APPFLOWY_MCP_TEST_BASE_URL: http://localhost:8002
  APPFLOWY_REDIS_URI: redis://redis:6379
  APPFLOWY_AI_REDIS_URL: redis://redis:6379
  LOCALHOST_GOTRUE: http://localhost/gotrue
  POSTGRES_PASSWORD: password
  DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
  SQLX_OFFLINE: true
  RUST_TOOLCHAIN: "1.98.0"
  CLOUD_TEST_FEATURES: ai-test-enabled,sync-v2,ci-test
  # Speed up crate downloads with sparse registry
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Faster for git dependencies
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # Disable incremental compilation in CI (faster clean builds)
  CARGO_INCREMENTAL: "0"

jobs:
  image_source:
    name: Resolve Cloud source and image builder
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      builder: ${{ steps.source.outputs.builder }}
    steps:
      - name: Checkout requested Cloud ref
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ github.event.client_payload.pr_ref || inputs.pr_ref }}
          persist-credentials: false
      - name: Pin the source for images and tests
        id: source
        env:
          IMAGE_BUILDER: ${{ inputs.image_builder || vars.CLOUD_IMAGE_BUILD_RUNNER || 'self-hosted' }}
        run: |
          case "$IMAGE_BUILDER" in
            self-hosted|github-hosted) ;;
            *) echo 'Unsupported CLOUD_IMAGE_BUILD_RUNNER'; exit 1 ;;
          esac
          source_sha="$(git rev-parse --verify HEAD)"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'builder=%s\n' "$IMAGE_BUILDER" >> "$GITHUB_OUTPUT"

  build_self_hosted:
    name: Wait for self-hosted images and Cloud test binaries
    needs: image_source
    if: needs.image_source.outputs.builder == 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.images.outputs.run_id }}
    steps:
      - name: Checkout CI tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request one private build and wait for its artifacts
        id: images
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.image_source.outputs.sha }}
          CI_TOOLS_SHA: ${{ github.sha }}
        run: python3 .github/scripts/request_image_build.py

  # The matrices below select test modules through explicit allow-lists, whose
  # failure mode is silence: a new test module nobody adds simply never runs.
  # This job fails naming any test-bearing module missing from the matrices.
  verify_test_module_coverage:
    name: Verify test module coverage
    needs: image_source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      encoded_cache_available: ${{ steps.encoded_cache.outputs.enabled }}
    steps:
      - name: Checkout CI Repo
        uses: actions/checkout@v4
        with:
          path: appflowy-ci

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}
          path: appflowy-cloud-premium

      - name: Detect encoded cache suite
        id: encoded_cache
        working-directory: appflowy-cloud-premium
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            script/test_encoded_cache.sh
            script/test_encoded_cache_dashboard.py
            script/test_encoded_cache_compose.py
          )
          present=0
          for script in "${scripts[@]}"; do
            if [[ -f "$script" ]]; then
              present=$((present + 1))
            fi
          done
          if (( present == 0 )); then
            echo '::notice::This Cloud ref predates the encoded cache suite; skipping its jobs.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif (( present == ${#scripts[@]} )); then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Incomplete encoded cache suite; all three test scripts are required.'
            exit 1
          fi

      - name: Every test-bearing module must be in a matrix
        run: |
          python3 appflowy-ci/scripts/check_test_module_coverage.py \
            --tests appflowy-cloud-premium/tests \
            --workflow appflowy-ci/.github/workflows/cloud_integration_ci.yaml \
            --workflow appflowy-ci/.github/workflows/cloud_commercial_integration_ci.yaml

  cache-contracts:
    name: Parallel cache and snapshot contracts
    needs: [verify_test_module_coverage, image_source]
    if: needs.verify_test_module_coverage.outputs.encoded_cache_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      APPFLOWY_CACHE_TEST_THREADS: '4'
      RUST_LOG: warn
      DISABLE_CI_TEST_LOG: 'true'
    services:
      postgres:
        # SQLx creates disposable databases. Redis and S3 fixtures run private local servers.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: encoded-cache-parallel-ci
      - name: Install required test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler redis-server locales
          sudo locale-gen en_US.UTF-8
          locale -a | grep -qi 'en_US.utf8'
          redis-server --version
      - name: Run cache and snapshot regressions with parallel libtest execution
        run: bash script/test_encoded_cache.sh

  cache-observability:
    name: Cache dashboard and CI configuration
    needs: [verify_test_module_coverage, image_source]
    if: needs.verify_test_module_coverage.outputs.encoded_cache_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMETHEUS_VERSION: '2.55.1'
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}
          persist-credentials: false
      - name: Install pinned Prometheus evaluator
        run: |
          set -euo pipefail
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          release="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          directory="${RUNNER_TEMP}/encoded-cache-prometheus"
          mkdir -p "$directory"
          cd "$directory"
          curl -fsSL --retry 3 "$release/$archive" -o "$archive"
          curl -fsSL --retry 3 "$release/sha256sums.txt" -o sha256sums.txt
          awk -v archive="$archive" '$2 == archive { print }' sha256sums.txt | sha256sum --check --strict
          tar -xzf "$archive" "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "$directory/prometheus-${PROMETHEUS_VERSION}.linux-amd64" >> "$GITHUB_PATH"
      - name: Evaluate actual Grafana queries against synthetic cache incidents
        run: python3 script/test_encoded_cache_dashboard.py
      - name: Verify both CI stacks activate all cache tiers
        run: python3 script/test_encoded_cache_compose.py

  build_cloud:
    needs: image_source
    if: needs.image_source.outputs.builder == 'github-hosted'
    name: Build appflowy_cloud Image (GitHub fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker builder prune -af || true
          docker image prune -af || true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Prepare env for Docker build
        run: cp deploy.env .env

      # NOTE: the cloud `Dockerfile` ignores PROFILE and always builds --release, so
      # test-only server code must sit behind the `ci-test` cargo feature rather than
      # `debug_assertions`. FEATURES below must stay in sync with the `--features`
      # passed to `cargo test`, or those tests call endpoints that 404.
      - name: Build Docker Image (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose-ci.yml
          targets: appflowy_cloud
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=cloud-integration-cloud
            *.cache-to=type=gha,scope=cloud-integration-cloud,mode=max
            *.args.BUILDKIT_INLINE_CACHE=1
            *.args.BUILDKIT_MULTI_PLATFORM=0
            *.args.PROFILE=debug
            *.args.APP_VERSION=0.9.999
            *.args.FEATURES=test-mailer,ci-test

      - name: Save Docker Image
        run: docker save appflowyinc/appflowy_cloud_premium:latest-amd64 | gzip > appflowy_cloud.tar.gz

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-cloud
          path: appflowy_cloud.tar.gz
          retention-days: 1

  build_worker:
    needs: image_source
    if: needs.image_source.outputs.builder == 'github-hosted'
    name: Build appflowy_worker Image (GitHub fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker builder prune -af || true
          docker image prune -af || true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Prepare env for Docker build
        run: cp deploy.env .env

      - name: Build Docker Image (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose-ci.yml
          targets: appflowy_worker
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=cloud-integration-worker
            *.cache-to=type=gha,scope=cloud-integration-worker,mode=max
            *.args.BUILDKIT_INLINE_CACHE=1
            *.args.BUILDKIT_MULTI_PLATFORM=0
            *.args.PROFILE=debug
            *.args.APP_VERSION=0.9.999

      - name: Save Docker Image
        run: docker save appflowyinc/appflowy_worker_premium:latest-amd64 | gzip > appflowy_worker.tar.gz

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-worker
          path: appflowy_worker.tar.gz
          retention-days: 1

  build_search:
    needs: image_source
    if: needs.image_source.outputs.builder == 'github-hosted'
    name: Build appflowy_search Image (GitHub fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker builder prune -af || true
          docker image prune -af || true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Prepare env for Docker build
        run: cp deploy.env .env

      - name: Build Docker Image (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose-ci.yml
          targets: appflowy_search
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=cloud-integration-search
            *.cache-to=type=gha,scope=cloud-integration-search,mode=max
            *.args.BUILDKIT_INLINE_CACHE=1
            *.args.BUILDKIT_MULTI_PLATFORM=0
            *.args.PROFILE=debug
            *.args.APP_VERSION=0.9.999

      - name: Save Docker Image
        run: docker save appflowyinc/appflowy_search_premium:latest-amd64 | gzip > appflowy_search.tar.gz

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-search
          path: appflowy_search.tar.gz
          retention-days: 1

  build_mcp:
    needs: image_source
    if: needs.image_source.outputs.builder == 'github-hosted'
    name: Build appflowy_mcp Image (GitHub fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker builder prune -af || true
          docker image prune -af || true

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Prepare env for Docker build
        run: cp deploy.env .env

      - name: Build Docker Image (cached)
        uses: docker/bake-action@v5
        with:
          files: docker-compose-ci.yml
          targets: appflowy_mcp
          load: true
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=cloud-integration-mcp
            *.cache-to=type=gha,scope=cloud-integration-mcp,mode=max
            *.args.BUILDKIT_INLINE_CACHE=1
            *.args.BUILDKIT_MULTI_PLATFORM=0
            *.args.PROFILE=debug
            *.args.APP_VERSION=0.9.999

      - name: Save Docker Image
        run: docker save appflowyinc/appflowy_mcp_premium:latest-amd64 | gzip > appflowy_mcp.tar.gz

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-mcp
          path: appflowy_mcp.tar.gz
          retention-days: 1

  build_test_binaries:
    name: Compile shared Cloud test binaries (GitHub fallback)
    needs: image_source
    if: needs.image_source.outputs.builder == 'github-hosted'
    # Keep the binary producer and consumers on one OS release during ubuntu-latest migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUD_CACHE_GROUP: root
      CLOUD_CACHE_WRITER: 'true'
      CLOUD_COMPILE_TESTS: 'true'
      RUSTC_WRAPPER: ''
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}
          persist-credentials: false
      - &cloud_ci_tools
        name: Checkout CI tools
        if: env.CLOUD_CACHE_GROUP == 'root'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: ci-tools
          persist-credentials: false

      - &cloud_free_disk
        name: Free disk space on runner
        run: |
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/ghc
          docker builder prune -af || true
          docker image prune -af || true
          echo "Disk usage after cleanup:"
          df -h

      - &cloud_rust_toolchain
        if: env.CLOUD_COMPILE_TESTS == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Root suites have the same Cargo features. Keep package-only configurations
      # separate, and let one lane per group save each immutable snapshot.
      - &cloud_cargo_cache
        name: Restore Cargo dependencies
        if: env.CLOUD_COMPILE_TESTS == 'true'
        id: cargo_cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: cloud-integration-${{ env.CLOUD_CACHE_GROUP }}
          save-if: ${{ env.CLOUD_CACHE_WRITER == 'true' }}
          cache-bin: false
          cache-all-crates: false

      - &cloud_sccache
        name: Setup sccache
        if: env.CLOUD_COMPILE_TESTS == 'true'
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
          # Report only the server actually used for compilation. The action's
          # post step otherwise starts a fresh server even after setup failed.
          disable_annotations: true
        continue-on-error: true

      - &cloud_sccache_config
        name: Configure sccache
        if: env.CLOUD_COMPILE_TESTS == 'true'
        id: sccache_config
        timeout-minutes: 2
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache.outcome }}
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [[ "$SCCACHE_SETUP_OUTCOME" != success ]]; then
            echo "::warning::sccache installation failed; using the Cargo dependency cache only."
            exit 0
          fi
          if [[ -z "${ACTIONS_RESULTS_URL:-}" || -z "${ACTIONS_RUNTIME_TOKEN:-}" ]]; then
            echo "::warning::GitHub cache v2 credentials are unavailable; compiler caching is disabled."
            exit 0
          fi

          export SCCACHE_GHA_ENABLED=true
          timeout 5 sccache --stop-server 2>/dev/null || true
          for attempt in 1 2; do
            if timeout 15 sccache --start-server 2>&1 && timeout 5 sccache --show-stats 2>&1; then
              echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
              echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "sccache is using the GitHub Actions cache."
              exit 0
            fi
            timeout 5 sccache --stop-server 2>/dev/null || true
            if [[ "$attempt" == 1 ]]; then
              echo "Retrying compiler cache startup in 3 seconds."
              sleep 3
            fi
          done
          echo "::warning::sccache startup failed twice; using the Cargo dependency cache only."

      - name: Install test build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libclang-dev libssl-dev pkg-config

      - name: Compile and archive Cloud test executables
        run: |
          python3 ci-tools/.github/scripts/cloud_test_binaries.py build \
            --features "$CLOUD_TEST_FEATURES" --archive "$RUNNER_TEMP/cloud-tests.tar.gz"

      - name: Upload shared Cloud test binaries
        uses: actions/upload-artifact@v4
        with:
          name: cloud-test-binaries-${{ needs.image_source.outputs.sha }}
          path: ${{ runner.temp }}/cloud-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - &cloud_cache_report
        name: Report Rust cache usage
        if: ${{ !cancelled() && env.CLOUD_COMPILE_TESTS == 'true' }}
        env:
          CACHE_GROUP: ${{ env.CLOUD_CACHE_GROUP }}
          CACHE_WRITER: ${{ env.CLOUD_CACHE_WRITER == 'true' }}
          CARGO_CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit || 'false' }}
          SCCACHE_ENABLED: ${{ steps.sccache_config.outputs.enabled || 'false' }}
        run: |
          # Backticks in the printf formats are literal Markdown code spans.
          # shellcheck disable=SC2016
          {
            printf '### Rust build cache\n\n'
            printf -- '- Cargo cache group: `%s`\n' "$CACHE_GROUP"
            printf -- '- Exact Cargo cache hit: `%s` (false may include a fallback restore)\n' "$CARGO_CACHE_HIT"
            printf -- '- Cargo snapshot writer: `%s`\n' "$CACHE_WRITER"
            printf -- '- Compiler cache enabled: `%s`\n\n' "$SCCACHE_ENABLED"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SCCACHE_ENABLED" == true ]]; then
            if timeout 10 sccache --show-stats > "$RUNNER_TEMP/sccache-stats.txt" 2>&1; then
              cat "$RUNNER_TEMP/sccache-stats.txt"
              {
                printf '```text\n'
                cat "$RUNNER_TEMP/sccache-stats.txt"
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Unable to collect compiler cache statistics."
              printf 'Compiler cache statistics unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf 'Compiler caching was unavailable; see the setup warnings above.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    name: Integration Tests (${{ matrix.topic }})
    runs-on: ubuntu-24.04
    needs: [image_source, build_test_binaries, build_self_hosted, build_cloud, build_worker, build_search, build_mcp]
    if: >-
      always() && !cancelled() && needs.image_source.result == 'success' &&
      ((needs.image_source.outputs.builder == 'self-hosted' &&
        needs.build_self_hosted.result == 'success') ||
       (needs.image_source.outputs.builder == 'github-hosted' &&
        needs.build_test_binaries.result == 'success' &&
        needs.build_cloud.result == 'success' && needs.build_worker.result == 'success' &&
        needs.build_search.result == 'success' && needs.build_mcp.result == 'success'))
    timeout-minutes: 60
    env:
      MINIO_DATA_DIR: /tmp/minio-data
      CLOUD_CACHE_GROUP: ${{ matrix.cache_group || 'root' }}
      CLOUD_CACHE_WRITER: ${{ matrix.cache_writer == true }}
      CLOUD_COMPILE_TESTS: ${{ matrix.cache_group != '' }}
      # Restore Cargo artifacts before enabling the optional compiler wrapper so
      # cache availability cannot change the Cargo snapshot's environment hash.
      RUSTC_WRAPPER: ""
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        include:
          # Topic groups share artifact downloads and Docker setup. Run unfiltered
          # root unit tests explicitly before the core integration filters.
          - test_service: "appflowy_cloud_core"
            topic: "Core APIs and utilities"
            test_root_unit: true
            test_modules: >-
              file_test
              yrs_test
              redis_test
              server_info
              cache_validation
              folder_test
              mcp
              mention_api
              workspace::notification_etag_test
              workspace::notification_events_test
              workspace::notification_inbox_test
              workspace::recent_notification_test
              workspace::throttle_test
          # Heavy workspace integration tests are split by Rust module path.
          # Each matrix entry still runs tests serially inside one Docker stack,
          # but independent suites can run in parallel across GitHub runners.
          - test_service: "appflowy_cloud_workspace_core"
            topic: "Workspace management"
            test_modules: >-
              workspace::access_request
              workspace::admin_copy_workspace_test
              workspace::admin_invitation_search_test
              workspace::admin_permissions_test
              workspace::admin_transfer_ownership_test
              workspace::csv_import_test
              workspace::database_listing_test
              workspace::default_user_workspace
              workspace::edit_workspace_test
              workspace::export_workspace_test
              workspace::folder_notification_test
              workspace::folder_projection_test
              workspace::folder_traversal_test
              workspace::form_share_test
              workspace::inline_comment
              workspace::integration_test
              workspace::invitation_crud_test
              workspace::join_workspace_test
              workspace::member_crud_test
              workspace::mention_incremental_cache_test
              workspace::mention_person_test
              workspace::nango_integration_test
              workspace::pdf_export_test
              workspace::plan_fixture
              workspace::quick_note_test
              workspace::template_test
              workspace::workspace_crud_test
              workspace::workspace_folder_test
              workspace::workspace_import_test
              workspace::workspace_reorder_test
              workspace::workspace_settings_test
          - test_service: "appflowy_cloud_workspace_permissions"
            topic: "Permissions and spaces"
            test_modules: >-
              workspace::private_space_migration_test
              workspace::space_permission_test
              workspace::space_policy_mutation_test
              workspace::structured_space_creation_test
              workspace::structured_space_update_test
              workspace::custom_space_test
              workspace::prd_space_acceptance_test
              workspace::space_group_permission_test
              workspace::permissions
          - test_service: "appflowy_cloud_workspace_content"
            topic: "Import and publishing"
            test_modules: >-
              workspace::document_import_test
              workspace::notion_import
              workspace::notion_import_test
              workspace::page_view
              workspace::publish
              workspace::published_data_test
          # Database history can leave a large indexing backlog. Its index test
          # runs first in the separate search topic, before other indexing work.
          - test_service: "appflowy_cloud_database"
            topic: "Databases"
            test_modules: "database"
            test_skips: "database::database_index_test"
          - test_service: "appflowy_cloud_collab"
            topic: "Realtime collaboration"
            test_modules: "collab"
          - test_service: "appflowy_cloud_api"
            topic: "AI and authentication"
            test_modules: "ai_test gotrue oidc user"
          # Preserve explicit SQL filters, including the permission differential
          # and share-union equivalence gates, within one persistence topic.
          - test_service: "appflowy_cloud_sql"
            topic: "SQL persistence"
            test_modules: >-
              sql_test::admin_guest_status_test
              sql_test::admin_user_test
              sql_test::chat_test
              sql_test::guest_limit_test
              sql_test::mcp_database_access_test
              sql_test::permission_mapping_test
              sql_test::spam_signal_test
              sql_test::spam_test
              sql_test::user_test
              test_pg_pool
              sql_test::database_row_permission_fact_test
              sql_test::exact_view_acl_fence_test
              sql_test::permission_differential_test
              sql_test::permission_generation_test
              sql_test::permission_resident_staleness_test
              sql_test::permission_share_union_test
              sql_test::realtime_collab_owner_test
              sql_test::space_acl_seed_test
              sql_test::space_user_delete_test
              sql_test::collab_db_ops_test
              sql_test::collab_embed_test
              sql_test::collab_history_graph_test
              sql_test::collab_restore_state_test
              sql_test::content_graph_test
              sql_test::content_processing_test
              sql_test::database_duplicate_upload_test
              sql_test::document_reference_test
              sql_test::parsed_content_test
              sql_test::pg_direct_write_test
              sql_test::folder_db_ops_test
              sql_test::folder_read_test
              sql_test::form_share_lifecycle_trigger_test
              sql_test::guest_workspace_test
              sql_test::publish_blob_ref_test
              sql_test::publish_test
              sql_test::quick_note_projection_test
              sql_test::recent_views_test
              sql_test::s3_cleanup_test
              sql_test::workspace_database_backfill_test
              sql_test::workspace_database_listing_test
              sql_test::workspace_database_sync_test
              sql_test::workspace_test
          - test_service: "appflowy_cloud_member_packages"
            topic: "Shared libraries"
            test_modules: ""
            cache_group: members
            cache_writer: true
          # Run database indexing first on a fresh stack, then search. Database
          # history and restore suites must not join this topic.
          - test_service: "appflowy_cloud_search"
            topic: "Search and indexing"
            test_modules: "database::database_index_test search"
          # Whitelist tests toggle GoTrue global state and need their own stack.
          - test_service: "appflowy_cloud_whitelist"
            topic: "Signup whitelist"
            test_modules: >-
              sql_test::whitelist_test
              user::admin_signup_whitelist_test
              user::admin_user_deletion_whitelist_test
              user::sign_up
              workspace::admin_system_config_test
          # SCIM directory-sync end-to-end (drives the real Authentik IdP
          # from docker-compose-ci.yml). The cloud image is the default build, so
          # SCIM is available with no seat limit and no license.
          - test_service: "appflowy_cloud_scim"
            topic: "SCIM provisioning"
            test_modules: "scim"
          # LDAP login + SCIM-interop end-to-end against the compose
          # openldap service (profile `ldap`, seeded from script/ldap/seed.ldif).
          - test_service: "appflowy_cloud_ldap"
            topic: "LDAP login"
            test_modules: "ldap"
          - test_service: "appflowy_search_package"
            topic: "Search service"
            test_modules: ""
            cache_group: search
            cache_writer: true
          - test_service: "appflowy_worker"
            topic: "Worker service"
            test_modules: ""
            cache_group: worker
            cache_writer: true
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: ${{ needs.image_source.outputs.sha }}

      - *cloud_ci_tools
      - *cloud_rust_toolchain
      - *cloud_cargo_cache
      - *cloud_sccache
      - *cloud_sccache_config

      - *cloud_free_disk

      - name: Download shared Cloud test binaries
        if: env.CLOUD_CACHE_GROUP == 'root'
        uses: actions/download-artifact@v4
        with:
          name: cloud-test-binaries-${{ needs.image_source.outputs.sha }}
          path: ${{ runner.temp }}/cloud-test-binaries
          repository: ${{ needs.build_self_hosted.outputs.run_id && 'AppFlowy-IO/AppFlowy-Cloud-Premium' || github.repository }}
          run-id: ${{ needs.build_self_hosted.outputs.run_id || github.run_id }}
          github-token: ${{ needs.build_self_hosted.outputs.run_id && secrets.ADMIN_GITHUB_TOKEN || github.token }}

      - name: Restore and verify shared Cloud test binaries
        if: env.CLOUD_CACHE_GROUP == 'root'
        run: |
          python3 ci-tools/.github/scripts/cloud_test_binaries.py restore \
            --archive "$RUNNER_TEMP/cloud-test-binaries/cloud-tests.tar.gz"
          rm "$RUNNER_TEMP/cloud-test-binaries/cloud-tests.tar.gz"

      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          merge-multiple: true
          repository: ${{ needs.build_self_hosted.outputs.run_id && 'AppFlowy-IO/AppFlowy-Cloud-Premium' || github.repository }}
          run-id: ${{ needs.build_self_hosted.outputs.run_id || github.run_id }}
          github-token: ${{ needs.build_self_hosted.outputs.run_id && secrets.ADMIN_GITHUB_TOKEN || github.token }}

      - name: Load Docker Images
        run: |
          set -euo pipefail
          ls -lh appflowy_*.tar.gz
          gunzip -c appflowy_cloud.tar.gz | docker load
          gunzip -c appflowy_worker.tar.gz | docker load
          gunzip -c appflowy_search.tar.gz | docker load
          gunzip -c appflowy_mcp.tar.gz | docker load
          echo "==> Loaded images:"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep appflowy || true

      - name: Remove downloaded image archives
        run: rm -f appflowy_cloud.tar.gz appflowy_worker.tar.gz appflowy_search.tar.gz appflowy_mcp.tar.gz

      - name: Copy and rename deploy.env to .env
        run: cp deploy.env .env

      - name: Replace values in .env
        run: |
          # log level
          # appflowy_search + search targets included so the search service's
          # startup decisions (S3 bootstrap, worker spawn/skip reasons) appear
          # in the "Show appflowy_search startup logs" step — without them a
          # skipped ensure worker is invisible and search test failures look
          # like flaky timeouts.
          sed -i 's|RUST_LOG=.*|RUST_LOG='appflowy_cloud=info,appflowy_worker=debug,appflowy_collaborate=info,indexer=info,appflowy_search=info,search=info,info'|' .env
          # GoTrue has a separate mailer from appflowy_cloud. Keep confirmation enabled so CI
          # exercises production-like repeated-signup behavior, but route all mail to Mailpit.
          # Mailpit does not require authentication. Leaving credentials populated makes
          # Go's SMTP client reject AUTH over this intentionally plaintext CI connection.
          sed -i 's|GOTRUE_SMTP_HOST=.*|GOTRUE_SMTP_HOST=mailpit|' .env
          sed -i 's|GOTRUE_SMTP_PORT=.*|GOTRUE_SMTP_PORT=1025|' .env
          sed -i 's|GOTRUE_SMTP_USER=.*|GOTRUE_SMTP_USER=|' .env
          sed -i 's|GOTRUE_SMTP_PASS=.*|GOTRUE_SMTP_PASS=|' .env
          sed -i 's|GOTRUE_SMTP_ADMIN_EMAIL=.*|GOTRUE_SMTP_ADMIN_EMAIL=notify@appflowy.io|' .env
          sed -i 's|GOTRUE_EXTERNAL_GOOGLE_ENABLED=.*|GOTRUE_EXTERNAL_GOOGLE_ENABLED=true|' .env
          sed -i 's|GOTRUE_MAILER_AUTOCONFIRM=.*|GOTRUE_MAILER_AUTOCONFIRM=false|' .env
          sed -i 's|API_EXTERNAL_URL=http://your-host/gotrue|API_EXTERNAL_URL=http://localhost/gotrue|' .env
          sed -i 's|GOTRUE_RATE_LIMIT_EMAIL_SENT=100|GOTRUE_RATE_LIMIT_EMAIL_SENT=1000|' .env
          sed -i 's|APPFLOWY_MAILER_SMTP_USERNAME=.*|APPFLOWY_MAILER_SMTP_USERNAME=${{ secrets.CI_GOTRUE_SMTP_USER }}|' .env
          sed -i 's|APPFLOWY_MAILER_SMTP_PASSWORD=.*|APPFLOWY_MAILER_SMTP_PASSWORD=${{ secrets.CI_GOTRUE_SMTP_PASS }}|' .env
          # Route outbound appflowy_cloud mail to the mailpit sidecar so the
          # email_delivery_* tests can assert delivery. The override only
          # activates because the image is built with `--features test-mailer`
          # above; release builds ignore these vars. `mailpit` is the service
          # name on the shared docker-compose network.
          echo 'APPFLOWY_MAILER_TEST_MODE=true' >> .env
          echo 'APPFLOWY_MAILER_TEST_SMTP_HOST=mailpit' >> .env
          echo 'APPFLOWY_MAILER_TEST_SMTP_PORT=1025' >> .env

          sed -i 's|AI_OPENAI_API_KEY=.*|AI_OPENAI_API_KEY=${{ secrets.CI_OPENAI_API_KEY }}|' .env
          sed -i 's|AI_OPENAI_API_SUMMARY_MODEL=.*|AI_OPENAI_API_SUMMARY_MODEL="gpt-5-mini"|' .env
          sed -i 's|APPFLOWY_EMBEDDING_CHUNK_SIZE=.*|APPFLOWY_EMBEDDING_CHUNK_SIZE=500|' .env
          sed -i 's|APPFLOWY_EMBEDDING_CHUNK_OVERLAP=.*|APPFLOWY_EMBEDDING_CHUNK_OVERLAP=50|' .env
          sed -i 's|ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${{ secrets.CI_AI_ANTHROPIC_API_KEY }}|' .env
          sed -i 's|AI_APPFLOWY_HOST=.*|AI_APPFLOWY_HOST=http://localhost|' .env
          sed -i 's|^#* *ASSEMBLYAI_API_KEY=.*|ASSEMBLYAI_API_KEY=${{ secrets.CI_ASSEMBLYAI_API_KEY }}|' .env

          sed -i 's|APPFLOWY_WEB_URL=.*|APPFLOWY_WEB_URL=http://localhost:3000|' .env
          sed -i 's|.*APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=.*|APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=http://localhost/minio-api|' .env
          sed -i 's|APPFLOWY_SPAM_USER_DETECT_THRESHOLD=.*|APPFLOWY_SPAM_USER_DETECT_THRESHOLD=1|' .env
          sed -i 's|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=.*|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=500|' .env

          echo '' >> .env
          echo 'APPFLOWY_KEYWORD_SEARCH_ENABLED=true' >> .env
          echo 'APPFLOWY_KEYWORD_WORKER_TICK_INTERVAL=3' >> .env
          echo 'APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES=5242880' >> .env
          echo 'APPFLOWY_WORKSPACE_ACTOR_SNAPSHOT_INTERVAL_SECS=15' >> .env
          echo 'APPFLOWY_PAGE_HISTORY_ENABLE=true' >> .env
          echo 'APPFLOWY_FEATURE_RULES_DOMAIN=appflowy.io' >> .env
          echo 'APPFLOWY_INVITE_MIN_ACCOUNT_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_MIN_WORKSPACE_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_HOUR=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_DAY=0' >> .env

          cat .env
        shell: bash

      - name: Disable historical keyword warm-up in CI
        run: |
          # The restored CI database marks many historical workspaces as recent. Rebuilding
          # those indexes competes with the integration test's explicit keyword tasks and makes
          # search readiness depend on an unrelated multi-thousand-task background backlog.
          sed -i '/- APPFLOWY_KEYWORD_WORKER_ENABLED=true/a\      - APPFLOWY_SEARCH_REPAIR_RECENT_WORKSPACE_WARMUP_LIMIT=0' docker-compose-ci.yml
          grep -q 'APPFLOWY_SEARCH_REPAIR_RECENT_WORKSPACE_WARMUP_LIMIT=0' docker-compose-ci.yml

      - name: Update Nginx Configuration
        # the wasm-pack headless tests will run on random ports, so we need to allow all origins
        run: |
          sed -i 's/http:\/\/127\.0\.0\.1:8000/http:\/\/127.0.0.1/g' nginx/nginx.conf
          cat nginx/nginx.conf

      - name: Install isolated test Redis
        if: >-
          matrix.test_service == 'appflowy_worker' ||
          matrix.test_service == 'appflowy_cloud_member_packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          # The tests spawn isolated Redis processes on random ports. Stop the package-managed
          # instance before Compose claims the host's standard Redis port.
          sudo systemctl stop redis-server || true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Run Docker-Compose
        timeout-minutes: 15
        run: |
          export APPFLOWY_WORKER_VERSION=latest-amd64
          export APPFLOWY_CLOUD_VERSION=latest-amd64
          export APPFLOWY_SEARCH_VERSION=latest-amd64
          export APPFLOWY_ADMIN_FRONTEND_VERSION=latest-amd64
          # Keep this aligned with AppFlowy-Cloud-Premium's integration workflow.
          export APPFLOWY_AI_VERSION=0.13.2-amd64
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_scim" ]; then
            export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}authentik"
          fi
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_ldap" ]; then
            export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}ldap"
          fi

          sudo rm -rf /tmp/minio-data || true
          echo "Starting services (using locally built images, pulling only missing ones)..."
          docker compose -f docker-compose-ci.yml up -d --pull=missing
          docker ps -a
          docker compose -f docker-compose-ci.yml logs pg_snapshot_unpack
          docker compose -f docker-compose-ci.yml logs appflowy_cloud

      - name: Show appflowy_search startup logs
        if: matrix.test_service == 'appflowy_cloud_search'
        run: docker compose -f docker-compose-ci.yml logs appflowy_search

      - name: Wait for appflowy cloud to be ready
        run: |
          echo "Waiting for services to be ready..."
          for i in {1..60}; do
            if curl -f http://localhost/api/health 2>/dev/null; then
              echo "Health check passed after $((i*5)) seconds"
              exit 0
            fi
            echo "Attempt $i: Health check failed, waiting 5 seconds..."
            sleep 5
          done
          echo "Health check timeout after 300 seconds - proceeding anyway"

      - name: Wait for Authentik
        if: matrix.test_service == 'appflowy_cloud_scim'
        run: |
          echo "Waiting for Authentik..."
          timeout 300 bash -c 'until curl -fsS http://localhost:9010/-/health/ready/ >/dev/null; do sleep 3; done'
          echo "Authentik ready."

      - name: Wait for OpenLDAP
        if: matrix.test_service == 'appflowy_cloud_ldap'
        run: |
          echo "Waiting for OpenLDAP..."
          timeout 180 bash -c 'until docker compose -f docker-compose-ci.yml --profile ldap exec -T openldap \
            ldapsearch -x -H ldap://localhost:1389 -D cn=admin,dc=example,dc=org -w adminpassword \
            -b ou=users,dc=example,dc=org "(uid=alice)" dn >/dev/null 2>&1; do sleep 3; done'
          echo "OpenLDAP ready."

      - name: Wait for MinIO to be ready
        run: |
          echo "Waiting for MinIO to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/ready 2>/dev/null; then
              echo "MinIO ready after $((i*3)) seconds"
              break
            fi
            echo "Attempt $i: MinIO not ready, waiting 3 seconds..."
            sleep 3
          done

          # Verify bucket is accessible via S3 API
          echo "Verifying MinIO bucket access..."
          for i in {1..10}; do
            if docker compose -f docker-compose-ci.yml exec -T minio mc ls local/ 2>/dev/null; then
              echo "MinIO bucket listing succeeded"
              exit 0
            fi
            if curl -sf http://localhost:9000/appflowy/ 2>/dev/null; then
              echo "MinIO bucket accessible via HTTP"
              exit 0
            fi
            echo "Attempt $i: Bucket not accessible, waiting 3 seconds..."
            sleep 3
          done
          echo "::warning::MinIO bucket check did not confirm access - dumping MinIO logs"
          docker compose -f docker-compose-ci.yml logs minio

      - name: Install prerequisites
        if: env.CLOUD_COMPILE_TESTS == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Run Tests
        timeout-minutes: 50
        env:
          RUN_ROOT_UNIT_TESTS: ${{ matrix.test_root_unit == true }}
          TEST_SKIPS: ${{ matrix.test_skips }}
        run: |
          set -e
          cargo_command=(cargo)
          if [[ "$CLOUD_CACHE_GROUP" == root ]]; then
            cargo_command=(python3 ci-tools/.github/scripts/cloud_test_binaries.py run)
          fi
          echo "Running tests for ${{ matrix.test_service }}"
          if [[ "${RUN_ROOT_UNIT_TESTS:-false}" == true ]]; then
            echo "==> Testing appflowy-cloud root unit tests"
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              --features "$CLOUD_TEST_FEATURES" --lib --bins \
              -- --skip stress_test --skip commercial_test --skip whitelist --test-threads=1
          fi
          if [ "${{ matrix.test_service }}" = "appflowy_search_package" ]; then
            echo "==> Testing appflowy-search package"
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              -p appflowy-search -- --test-threads=1
          elif [ "${{ matrix.test_service }}" = "appflowy_cloud_member_packages" ]; then
            # The former appflowy-collaborate umbrella was split into focused
            # libraries. Keep their moved unit and integration tests in this
            # service-backed lane so removing the umbrella does not reduce coverage.
            echo "==> Testing workspace member packages"
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              -p workspace-folder \
              -p collab-storage \
              -p database-blob \
              -p collab-access \
              -p collab-indexing \
              -p collab-snapshot \
              -p collab-history \
              -p collab-realtime \
              -p collab-realtime-server \
              -p indexer \
              -p collab-stream \
              -p database \
              -p workspace-permission \
              -p pdf-exporter \
              -p collab \
              -p collab-rt-entity \
              -p appflowy-proto \
              -- --test-threads=1
          elif [ "${{ matrix.test_service }}" = "appflowy_worker" ]; then
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              -p appflowy-worker -- --test-threads=1
          elif [ "${{ matrix.test_service }}" = "appflowy_cloud_whitelist" ]; then
            # Whitelist tests run in isolation — they toggle GoTrue global state.
            # `${module}::` makes the filter a Rust path prefix rather than a
            # substring, so e.g. `workspace::` matches tests in `tests/workspace/`
            # but not `mcp::tools_test::get_self_returns_workspace_id`.
            for module in ${{ matrix.test_modules }}; do
              echo "==> Testing module: ${module}"
              RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
                --features "$CLOUD_TEST_FEATURES" "${module}::" \
                -- --skip stress_test --skip commercial_test --test-threads=1
            done
          elif [ "${{ matrix.test_service }}" = "appflowy_cloud_ldap" ]; then
            # The cloud container dials the directory over the compose network;
            # the test process reaches OpenLDAP through its published port. LDAP
            # login requests target appflowy-cloud's published port directly so
            # each test's documentation-range XFF address reaches the limiter.
            # The general nginx route correctly replaces caller XFF with the
            # runner's one address, which would make every negative test share
            # and exhaust a single production-style IP bucket.
            echo "==> LDAP end-to-end (openldap)"
            LOCALHOST_URL=http://localhost:8000 \
            LDAP_TEST_SERVER=ldap://openldap:1389 \
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              --features "$CLOUD_TEST_FEATURES" "ldap::" \
              -- --skip stress_test --skip commercial_test --test-threads=1
          elif [ "${{ matrix.test_service }}" = "appflowy_cloud_scim" ]; then
            # SCIM end-to-end against the real Authentik IdP (from docker-compose-ci.yml).
            # Authentik (in docker) reaches the cloud over the compose network; the
            # test (on the runner) reaches Authentik's health port and drives it via
            # `docker exec`. The cloud image is the default build, so SCIM is available
            # with no seat limit and no license.
            echo "==> SCIM directory-sync end-to-end (Authentik)"
            SCIM_URL_FOR_AUTHENTIK=http://appflowy_cloud:8000/scim/v2 \
            AUTHENTIK_HEALTH_URL=http://localhost:9010/-/health/ready/ \
            RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
              --features "$CLOUD_TEST_FEATURES" "scim::" \
              -- --test-threads=1 --nocapture
          else
            # Run root crate integration tests module by module.
            # `${module}::` makes the filter a Rust path prefix rather than a
            # substring, so a module like `workspace` only matches tests under
            # `tests/workspace/` and not unrelated `mcp::*workspace*` or
            # `search::*workspace*` tests.
            # Skip whitelist tests — they run in the dedicated whitelist group.
            skip_args=()
            for skipped_test in ${TEST_SKIPS:-}; do
              skip_args+=(--skip "${skipped_test}")
            done
            for module in ${{ matrix.test_modules }}; do
              echo "==> Testing module: ${module}"
              RUST_LOG="info" DISABLE_CI_TEST_LOG="true" "${cargo_command[@]}" test --locked \
                --features "$CLOUD_TEST_FEATURES" "${module}::" \
                -- --skip stress_test --skip commercial_test --skip whitelist \
                "${skip_args[@]}" --test-threads=1
            done
          fi

      # Each root integration lane restores its own snapshot. Deleting Eva here cannot race the
      # ordinary modules in this lane or another matrix job. Older Cloud refs lack the runner.
      - name: Final seeded account deletion
        if: matrix.test_modules != '' && hashFiles('script/test_final_account_deletion.sh') != ''
        timeout-minutes: 5
        run: |
          # Keep the source-owned destructive-test guard and ordering check, using the archive
          # for its two cargo invocations (listing first, then the exact ignored test).
          cargo() {
            python3 "$GITHUB_WORKSPACE/ci-tools/.github/scripts/cloud_test_binaries.py" run "$@"
          }
          export -f cargo
          bash script/test_final_account_deletion.sh --features "$CLOUD_TEST_FEATURES"

      - *cloud_cache_report

      - name: Collect Docker logs
        if: failure()
        run: |
          docker ps -a > docker-ps-output.txt
          docker compose -f docker-compose-ci.yml logs appflowy_cloud > appflowy_cloud_logs.txt
          docker compose -f docker-compose-ci.yml logs appflowy_mcp > appflowy_mcp_logs.txt
          docker compose -f docker-compose-ci.yml logs appflowy_worker > appflowy_worker_logs.txt
          docker compose -f docker-compose-ci.yml logs appflowy_search > appflowy_search_logs.txt 2>&1 || true
          docker compose -f docker-compose-ci.yml logs ai > appflowy_ai_logs.txt 2>&1 || true
          docker compose -f docker-compose-ci.yml logs gotrue > gotrue_logs.txt 2>&1 || true
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_scim" ]; then
            docker compose -f docker-compose-ci.yml --profile authentik \
              logs authentik-db authentik-server authentik-worker > authentik_logs.txt 2>&1 || true
          fi
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_ldap" ]; then
            docker compose -f docker-compose-ci.yml --profile ldap \
              logs openldap > openldap_logs.txt 2>&1 || true
          fi

      - name: Upload Logs as Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appflowy-cloud-logs-${{ matrix.test_service }}-${{ github.run_id }}
          path: |
            docker-ps-output.txt
            appflowy_cloud_logs.txt
            appflowy_mcp_logs.txt
            appflowy_worker_logs.txt
            appflowy_search_logs.txt
            appflowy_ai_logs.txt
            gotrue_logs.txt
            authentik_logs.txt
            openldap_logs.txt
          retention-days: 1

  notify-webhook:
    name: Notify Webhook
    runs-on: ubuntu-latest
    needs: [image_source, build_test_binaries, build_self_hosted, verify_test_module_coverage, build_cloud, build_worker, build_search, build_mcp, test, cache-contracts, cache-observability]
    # Report failures and skipped dependencies, but let cancelled runs release
    # their PR concurrency slot without waiting for a notification runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate integration results
        id: result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['NEEDS_JSON'])
          results = [job['result'] for job in needs.values()]
          if 'failure' in results:
              status = 'failure'
          elif 'cancelled' in results:
              status = 'cancelled'
          else:
              status = needs['test']['result']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'status={status}\n')
          PY
      - name: Send webhook notification
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          event-type: ci-result
          client-payload: |
            {
              "execution_id": "${{ github.event.client_payload.execution_id || inputs.execution_id || github.run_id }}",
              "workflow_type": "integration",
              "status": "${{ steps.result.outputs.status }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
