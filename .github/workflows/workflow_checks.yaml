name: Workflow checks

on:
  # CI-repository PRs validate the orchestration itself. Application suites use
  # private-source dispatches or explicit manual validation of this CI revision.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/docker/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B -m unittest discover -s .github/scripts
      - run: python -B -m unittest discover -s scripts -p 'test_check_test_module_coverage.py'
