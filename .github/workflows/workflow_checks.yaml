name: Workflow checks

on:
  # CI-repository PRs validate the orchestration itself. Application suites use
  # private-source dispatches or explicit manual validation of this CI revision.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/docker/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify video debugger prerequisites on relevant PRs
        if: github.event_name == 'pull_request'
        timeout-minutes: 2
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
              .github/scripts/desktop_video_stacks.py .github/scripts/test_desktop_video_stacks.py \
              .github/workflows/flutter_ci.yaml .github/workflows/workflow_checks.yaml; then
            exit 0
          fi
          if [ ! -x /usr/bin/gdb ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
          echo "TEST_HOSTED_VIDEO_PTRACE=1" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python -B -m unittest discover -s .github/scripts
      - run: python -B -m unittest discover -s scripts -p 'test_check_test_module_coverage.py'
