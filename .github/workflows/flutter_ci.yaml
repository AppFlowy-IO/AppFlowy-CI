name: PR 1546 failed-test validation
run-name: 'PR 1546: unit shard 2, database_rows, document at ae1f8ebbec'
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.41.9
  RUST_TOOLCHAIN: 1.92.0
  CARGO_MAKE_VERSION: 0.37.18
  CLOUD_VERSION: latest-amd64
  TIMELINE_CLOUD_IMAGE: appflowyinc/appflowy_cloud:latest-amd64
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_INCREMENTAL: '0'
  PREPARED_RUN_ID: '41284363196'
  DESKTOP_SOURCE_SHA: ae1f8ebbec4fc40b7cc63d395b87bd10027db5d0
  PREPARED_DESKTOP_SHA: a51a923d421525d77ce527796796c625dd496383
concurrency:
  group: pr1546-failed-tests-ae1f8ebbec
  cancel-in-progress: false
jobs:
  unit_test:
    name: Unit tests (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
        - ubuntu-latest
        shard:
        - 2
        include:
        - os: ubuntu-latest
          flutter_profile: development-linux-x86_64
          target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - name: Checkout private repository
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-Premium
        token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        ref: ${{ env.DESKTOP_SOURCE_SHA }}
        fetch-depth: 2
    - name: Check out the exact CI runtime tools
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-CI
        ref: ${{ github.sha }}
        path: .desktop-ci-tools
        persist-credentials: false
    - name: Configure Ubuntu package downloads
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 "$GITHUB_WORKSPACE/.desktop-ci-tools/.github/scripts/configure_flutter_apt.py"
    - name: Install Rust toolchain
      id: rust_toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        target: ${{ matrix.target }}
        override: true
        profile: minimal
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ matrix.os }}
        workspaces: |
          frontend/rust-lib
        cache-all-crates: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}, duckscript_cli
    - name: Install prerequisites
      timeout-minutes: 10
      working-directory: frontend
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev libepoxy-dev
          sudo apt-get install keybinder-3.0 libnotify-dev libwayland-cursor0 libwayland-client0 libwayland-egl1 unzip liblzma-dev
          sudo apt-get install -y libmpv-dev mpv libasound2-dev
          # Install GStreamer for audioplayers_linux
          # Install libunwind-dev first to resolve dependency issues
          sudo apt-get -y install libunwind-dev
          sudo apt-get -y install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
        fi
      shell: bash
    - name: Enable Flutter Desktop
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          flutter config --enable-linux-desktop
        elif [ "$RUNNER_OS" == "macOS" ]; then
          flutter config --enable-macos-desktop
        elif [ "$RUNNER_OS" == "Windows" ]; then
          git config --system core.longpaths true
          flutter config --enable-windows-desktop
        fi
      shell: bash
    - uses: actions/download-artifact@v4
      with:
        name: ${{ env.PREPARED_RUN_ID }}-ubuntu-latest
        run-id: ${{ env.PREPARED_RUN_ID }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
    - name: Uncompress appflowy_flutter
      run: tar -xf appflowy_flutter.tar.gz
    - name: Verify prepared source and Linux backend
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import os
        from pathlib import Path
        import subprocess
        expected = os.environ['DESKTOP_SOURCE_SHA']
        prepared = os.environ['PREPARED_DESKTOP_SHA']
        actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if actual != expected:
            raise SystemExit('Checkout differs from the requested Desktop source')
        subprocess.run(['git', 'merge-base', '--is-ancestor', prepared, 'HEAD'], check=True)
        overlay = {
            'frontend/appflowy_flutter/test/shared/database_tab_bar_test_helpers.dart',
            'frontend/appflowy_flutter/integration_test/desktop/cloud/document/document_lock_page_test.dart',
        }
        allowed = overlay | {
            'frontend/.claude/skills/appflowy-bdd-test/references/helpers.md',
        }
        changed = set(subprocess.check_output(
            ['git', 'diff', '--name-only', prepared, 'HEAD'], text=True,
        ).splitlines())
        if changed - allowed:
            raise SystemExit('Prepared native build inputs changed: ' + str(sorted(changed - allowed)))
        files = [
            'integration_test/shared/common_operations.dart',
            'test/shared/database_tab_bar_test_helpers.dart',
            'test/step/_remote_nested_database_board_helpers.dart',
            'test/step/the_user_inspects_each_created_row_template_page.dart',
            'test/widget_test/dashboard_history_shortcuts_test.dart',
            'test/widget_test/database_view_switcher_test.dart',
            'test/widget_test/open_page_in_tab_helper_test.dart',
            'integration_test/desktop/cloud/document/document_lock_page_test.dart',
        ]
        for relative in files:
            path = 'frontend/appflowy_flutter/' + relative
            trusted = subprocess.check_output(['git', 'show', prepared + ':' + path])
            if Path(path).read_bytes() != trusted:
                raise SystemExit('Prepared artifact differs from its recorded source: ' + relative)
        subprocess.run(['git', 'restore', '--source=HEAD', '--worktree', '--', *sorted(overlay)], check=True)
        for relative in files:
            path = 'frontend/appflowy_flutter/' + relative
            trusted = subprocess.check_output(['git', 'show', 'HEAD:' + path])
            if Path(path).read_bytes() != trusted:
                raise SystemExit('Test source differs from the requested commit: ' + relative)
        library = Path('frontend/appflowy_flutter/linux/flutter/dart_ffi/libdart_ffi.so')
        with library.open('rb') as handle:
            header = handle.read(20)
        if header[:6] != b'\x7fELF\x02\x01' or header[18:20] != b'\x3e\x00':
            raise SystemExit('Expected the prepared AMD64 Linux FFI library')
        print('Verified unchanged native inputs from', prepared, 'with test source', expected)
        PYCODE
    - name: Run flutter pub get
      working-directory: frontend
      run: cargo make pub_get
    - name: Run Flutter unit tests
      timeout-minutes: 45
      shell: bash
      run: |
        cd frontend

        set +e
        (
          set -e
          case "$RUNNER_OS" in
            macOS)
              test_profile="test-macos-$(uname -m)"
              cargo make --profile "$test_profile" inner_build_test_backend
              ;;
            Linux)
              test_profile=test-linux
              cargo make --allow-private --profile "$test_profile" copy-from-build-to-sandbox-folder
              ;;
            Windows)
              test_profile=test-windows
              cargo make --allow-private --profile "$test_profile" copy-from-build-to-sandbox-folder
              ;;
            *) echo "Unsupported unit-test runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          if [ "$APPFLOWY_DART_TEST_SHARD_INDEX" = "0" ]; then
            cargo make --profile "$test_profile" dart_package_unit_test
          fi
          cd appflowy_flutter
          # Dart's shard flags divide tests within each suite, so every
          # runner still compiles every file. Partition files before loading.
          test_list="$(mktemp)"
          trap 'rm -f "$test_list"' EXIT
          python3 - "$test_list" <<'PY'
        import os
        from pathlib import Path
        import sys

        count = int(os.environ["APPFLOWY_DART_TEST_TOTAL_SHARDS"])
        index = int(os.environ["APPFLOWY_DART_TEST_SHARD_INDEX"])
        if count < 1 or not 0 <= index < count:
            raise SystemExit("Invalid Flutter test shard")
        files = sorted(str(path) for path in Path("test").rglob("*_test.dart") if path.is_file())
        selected = files[index::count]
        if not selected:
            raise SystemExit("Flutter test shard has no test files")
        Path(sys.argv[1]).write_bytes(b"".join(path.encode() + b"\0" for path in selected))
        PY
          test_files=()
          while IFS= read -r -d '' test_file; do
            test_files+=("$test_file")
          done < "$test_list"
          flutter test --verbose --concurrency=1 --coverage \
            --file-reporter=json:/tmp/unit-test-events.jsonl "${test_files[@]}"
        ) 2>&1 | tee /tmp/test_output.txt
        TEST_EXIT=$?
        set -eo pipefail

        if [ $TEST_EXIT -eq 0 ]; then
          echo "Unit test shard ${APPFLOWY_DART_TEST_SHARD_INDEX:-0} passed"
        else
          echo "Unit test shard ${APPFLOWY_DART_TEST_SHARD_INDEX:-0} failed (exit $TEST_EXIT)"
        fi

        exit $TEST_EXIT
      env:
        APPFLOWY_DART_TEST_TOTAL_SHARDS: '4'
        APPFLOWY_DART_TEST_SHARD_INDEX: ${{ matrix.shard }}
        DISABLE_EVENT_LOG: true
        DISABLE_CI_TEST_LOG: 'true'
    - name: Upload unit test output
      if: always()
      timeout-minutes: 3
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-output-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
        path: |
          /tmp/test_output.txt
          /tmp/unit-test-events.jsonl
        retention-days: 7
  cloud_integration_test:
    name: Cloud integration test (${{ matrix.cloud_test_suite }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os:
        - ubuntu-latest
        cloud_test_suite:
        - database_rows
        - document
        include:
        - os: ubuntu-latest
          flutter_profile: development-linux-x86_64
          target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MINIO_DATA_DIR: /tmp/minio-data
      APPFLOWY_CLOUD_URL: https://localhost
      APPFLOWY_TEST_DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/postgres
    steps:
    - name: Checkout private repository
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-Premium
        token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        ref: ${{ env.DESKTOP_SOURCE_SHA }}
        fetch-depth: 2
    - name: Check out the exact CI runtime tools
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-CI
        ref: ${{ github.sha }}
        path: .desktop-ci-tools
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Select SDK pins from the tested Desktop source
      run: python3 .desktop-ci-tools/.github/scripts/select_desktop_toolchain.py --source frontend --fallback-rust "$RUST_TOOLCHAIN"
    - name: Configure Ubuntu package downloads
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 "$GITHUB_WORKSPACE/.desktop-ci-tools/.github/scripts/configure_flutter_apt.py"
    - name: Checkout AppFlowy-Cloud-Premium code
      uses: actions/checkout@v4
      with:
        repository: AppFlowy-IO/AppFlowy-Cloud-Premium
        token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        path: AppFlowy-Cloud-Premium
        ref: main
    - name: Prepare appflowy cloud env
      working-directory: AppFlowy-Cloud-Premium
      run: |
        # log level
        cp deploy.env .env
        #sed -i 's|RUST_LOG=.*|RUST_LOG=appflowy_cloud=trace,appflowy_collaborate=trace|' .env
        sed -i 's|^FQDN=.*|FQDN=localhost|' .env
        sed -i 's|^SCHEME=.*|SCHEME=https|' .env
        sed -i 's|^WS_SCHEME=.*|WS_SCHEME=wss|' .env
        sed -i 's/GOTRUE_EXTERNAL_GOOGLE_ENABLED=.*/GOTRUE_EXTERNAL_GOOGLE_ENABLED=true/' .env
        sed -i 's|GOTRUE_MAILER_AUTOCONFIRM=.*|GOTRUE_MAILER_AUTOCONFIRM=true|' .env
        sed -i 's|API_EXTERNAL_URL=.*|API_EXTERNAL_URL=https://localhost|' .env
        sed -i 's|AI_OPENAI_API_KEY=.*|AI_OPENAI_API_KEY=${{ secrets.CI_OPENAI_API_KEY }}|' .env
        sed -i 's|APPFLOWY_SPAM_DETECT_ENABLED=.*|APPFLOWY_SPAM_DETECT_ENABLED=false|' .env
        sed -i 's|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=.*|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=500|' .env
        sed -i 's|.*APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=.*|APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=https://localhost/minio-api|' .env

        echo '' >> .env
        echo 'APPFLOWY_PAGE_HISTORY_ENABLE=true' >> .env
        echo 'APPFLOWY_FEATURE_RULES_DOMAIN=appflowy.io' >> .env
        echo 'APPFLOWY_INVITE_MIN_ACCOUNT_AGE_SECS=0' >> .env
        echo 'APPFLOWY_INVITE_MIN_WORKSPACE_AGE_SECS=0' >> .env
        echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_HOUR=0' >> .env
        echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_DAY=0' >> .env
    - name: Trust localhost HTTPS for cloud tests
      working-directory: AppFlowy-Cloud-Premium
      run: |
        # Public Forms require HTTPS. Use a fresh localhost certificate and
        # the runner's trust store so Dart, native HTTP, and WebSockets verify TLS.
        umask 077
        cert_dir=$(mktemp -d "$RUNNER_TEMP/appflowy-ci-tls.XXXXXX")
        trap 'rm -rf "$cert_dir"' EXIT
        openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
          -subj '/CN=AppFlowy CI Root' \
          -addext 'basicConstraints=critical,CA:TRUE' \
          -addext 'keyUsage=critical,keyCertSign,cRLSign' \
          -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.crt"
        openssl req -new -newkey rsa:2048 -nodes -subj '/CN=localhost' \
          -keyout nginx/ssl/private_key.key -out "$cert_dir/server.csr"
        cat > "$cert_dir/server.ext" <<'EOF'
        basicConstraints=critical,CA:FALSE
        keyUsage=critical,digitalSignature,keyEncipherment
        extendedKeyUsage=serverAuth
        subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1
        EOF
        openssl x509 -req -days 2 -in "$cert_dir/server.csr" \
          -CA "$cert_dir/ca.crt" -CAkey "$cert_dir/ca.key" -CAcreateserial \
          -extfile "$cert_dir/server.ext" -out nginx/ssl/certificate.crt
        chmod 600 nginx/ssl/private_key.key
        sudo install -m 0644 "$cert_dir/ca.crt" \
          /usr/local/share/ca-certificates/appflowy-ci.crt
        sudo update-ca-certificates
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Clean Docker-Compose
      working-directory: AppFlowy-Cloud-Premium
      env:
        APPFLOWY_CLOUD_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_HISTORY_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_WORKER_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_ADMIN_FRONTEND_VERSION: ${{ env.CLOUD_VERSION }}
      run: |
        echo "Cleaning up any existing containers..."
        docker compose -f docker-compose-ci.yml down -v --remove-orphans || true
        docker container prune -f || true
        docker volume prune -f || true
        sudo rm -rf /tmp/minio-data || true
    - name: Start the verified exact Cloud runtime
      id: exact-cloud
      uses: ./.desktop-ci-tools/.github/actions/desktop-cloud-runtime
      with:
        cloud-source-sha: ''
        image-run-id: ''
        desktop-ref: ${{ env.DESKTOP_SOURCE_SHA }}
        github-token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        timeline: ${{ matrix.cloud_test_suite == 'timeline' }}
        timeline-image: ${{ env.TIMELINE_CLOUD_IMAGE }}
    - name: Run Docker-Compose from published registry images
      if: steps.exact-cloud.outputs.enabled == 'false'
      working-directory: AppFlowy-Cloud-Premium
      env:
        APPFLOWY_CLOUD_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_HISTORY_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_WORKER_VERSION: ${{ env.CLOUD_VERSION }}
        APPFLOWY_ADMIN_FRONTEND_VERSION: ${{ env.CLOUD_VERSION }}
        TIMELINE: ${{ matrix.cloud_test_suite == 'timeline' }}
        TIMELINE_IMAGE: ${{ env.TIMELINE_CLOUD_IMAGE }}
      run: |
        echo "Pulling and starting containers..."
        args=()
        if [[ "$TIMELINE" == true ]]; then args+=(--timeline); fi
        python3 ../.desktop-ci-tools/.github/scripts/desktop_cloud_runtime.py registry \
          --cloud . --timeline-image "$TIMELINE_IMAGE" "${args[@]}"
        docker ps -a
        docker compose -f docker-compose-ci.yml logs appflowy_cloud
    - name: Wait for appflowy cloud to be ready
      working-directory: AppFlowy-Cloud-Premium
      run: |
        echo "Waiting for services to be ready..."
        for i in {1..60}; do
          if curl --fail --show-error --max-time 5 "$APPFLOWY_CLOUD_URL/api/health"; then
            echo "Health check passed after $((i*5)) seconds"
            exit 0
          fi
          echo "Attempt $i: Health check failed, waiting 5 seconds..."
          sleep 5
        done
        echo "::error::Cloud HTTPS health check timed out"
        exit 1
    - name: Verify self-hosted Cloud for Timeline tests
      if: matrix.cloud_test_suite == 'timeline'
      working-directory: AppFlowy-Cloud-Premium
      run: |
        curl --fail --show-error --silent "$APPFLOWY_CLOUD_URL/api/server-info" \
          > /tmp/timeline-server-info.json
        python3 - <<'PY'
        import json

        with open('/tmp/timeline-server-info.json', encoding='utf-8') as handle:
            payload = json.load(handle)
        server_info = payload.get('data', payload)
        if server_info.get('self_hosted') is not True:
            raise SystemExit(
                'Timeline tests require a self-hosted Cloud image; '
                f"server-info reported self_hosted={server_info.get('self_hosted')!r}"
            )
        print('Timeline Cloud server reports self_hosted=true')
        PY
    - name: Wait for MinIO to be ready
      working-directory: AppFlowy-Cloud-Premium
      run: |
        echo "Waiting for MinIO to be ready..."
        for i in {1..30}; do
          if curl -sf http://localhost:9000/minio/health/ready 2>/dev/null; then
            echo "MinIO ready after $((i*3)) seconds"
            break
          fi
          echo "Attempt $i: MinIO not ready, waiting 3 seconds..."
          sleep 3
        done

        # Verify bucket is accessible via S3 API
        echo "Verifying MinIO bucket access..."
        for i in {1..10}; do
          if docker compose -f docker-compose-ci.yml exec -T minio mc ls local/ 2>/dev/null; then
            echo "MinIO bucket listing succeeded"
            exit 0
          fi
          # Fallback: try raw S3 list via curl
          if curl -sf http://localhost:9000/appflowy/ 2>/dev/null; then
            echo "MinIO bucket accessible via HTTP"
            exit 0
          fi
          echo "Attempt $i: Bucket not accessible, waiting 3 seconds..."
          sleep 3
        done
        echo "::warning::MinIO bucket check did not confirm access - dumping MinIO logs"
        docker compose -f docker-compose-ci.yml logs minio
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}
    - name: Install prerequisites
      timeout-minutes: 10
      working-directory: frontend
      shell: bash
      run: |
        setup_log="$RUNNER_TEMP/flutter-prerequisites.log"
        trap 'setup_status=$?; if [ "$setup_status" -ne 0 ]; then echo "::error::Flutter prerequisites failed; last 100 log lines:"; tail -n 100 "$setup_log"; fi; exit "$setup_status"' EXIT
        echo "Installing Flutter Linux prerequisites..."
        {
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev libepoxy-dev
          sudo apt-get install -y keybinder-3.0 libnotify-dev libwayland-cursor0 libwayland-client0 libwayland-egl1 unzip liblzma-dev network-manager postgresql-client
          sudo apt-get install -y libmpv-dev mpv libasound2-dev
          # Install GStreamer for audioplayers_linux
          # Install libunwind-dev first to resolve dependency issues
          sudo apt-get -y install libunwind-dev
          sudo apt-get -y install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
        } > "$setup_log" 2>&1
        echo "Flutter Linux prerequisites installed; full log retained in the cloud-test-output artifact."
    - name: Enable Flutter Desktop
      run: |
        flutter config --enable-linux-desktop
      shell: bash
    - uses: actions/download-artifact@v4
      with:
        name: ${{ env.PREPARED_RUN_ID }}-ubuntu-latest
        run-id: ${{ env.PREPARED_RUN_ID }}
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
    - name: Uncompressed appflowy_flutter
      run: |
        tar -xf appflowy_flutter.tar.gz
    - name: Verify prepared source and Linux backend
      shell: bash
      run: |
        python3 - <<'PYCODE'
        import os
        from pathlib import Path
        import subprocess
        expected = os.environ['DESKTOP_SOURCE_SHA']
        prepared = os.environ['PREPARED_DESKTOP_SHA']
        actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
        if actual != expected:
            raise SystemExit('Checkout differs from the requested Desktop source')
        subprocess.run(['git', 'merge-base', '--is-ancestor', prepared, 'HEAD'], check=True)
        overlay = {
            'frontend/appflowy_flutter/test/shared/database_tab_bar_test_helpers.dart',
            'frontend/appflowy_flutter/integration_test/desktop/cloud/document/document_lock_page_test.dart',
        }
        allowed = overlay | {
            'frontend/.claude/skills/appflowy-bdd-test/references/helpers.md',
        }
        changed = set(subprocess.check_output(
            ['git', 'diff', '--name-only', prepared, 'HEAD'], text=True,
        ).splitlines())
        if changed - allowed:
            raise SystemExit('Prepared native build inputs changed: ' + str(sorted(changed - allowed)))
        files = [
            'integration_test/shared/common_operations.dart',
            'test/shared/database_tab_bar_test_helpers.dart',
            'test/step/_remote_nested_database_board_helpers.dart',
            'test/step/the_user_inspects_each_created_row_template_page.dart',
            'test/widget_test/dashboard_history_shortcuts_test.dart',
            'test/widget_test/database_view_switcher_test.dart',
            'test/widget_test/open_page_in_tab_helper_test.dart',
            'integration_test/desktop/cloud/document/document_lock_page_test.dart',
        ]
        for relative in files:
            path = 'frontend/appflowy_flutter/' + relative
            trusted = subprocess.check_output(['git', 'show', prepared + ':' + path])
            if Path(path).read_bytes() != trusted:
                raise SystemExit('Prepared artifact differs from its recorded source: ' + relative)
        subprocess.run(['git', 'restore', '--source=HEAD', '--worktree', '--', *sorted(overlay)], check=True)
        for relative in files:
            path = 'frontend/appflowy_flutter/' + relative
            trusted = subprocess.check_output(['git', 'show', 'HEAD:' + path])
            if Path(path).read_bytes() != trusted:
                raise SystemExit('Test source differs from the requested commit: ' + relative)
        library = Path('frontend/appflowy_flutter/linux/flutter/dart_ffi/libdart_ffi.so')
        with library.open('rb') as handle:
            header = handle.read(20)
        if header[:6] != b'\x7fELF\x02\x01' or header[18:20] != b'\x3e\x00':
            raise SystemExit('Expected the prepared AMD64 Linux FFI library')
        print('Verified unchanged native inputs from', prepared, 'with test source', expected)
        PYCODE
    - name: Inspect media_kit native plugin
      working-directory: frontend/appflowy_flutter
      run: |
        find build/linux -name 'libmedia_kit_video_plugin.so' -print -exec ldd {} \; || true
        pkg-config --modversion mpv || true
        pkg-config --modversion epoxy || true
    - name: Run Flutter integration tests (${{ matrix.cloud_test_suite }})
      id: cloud-test-run
      timeout-minutes: 45
      shell: bash
      run: "cd frontend/appflowy_flutter\nflutter pub get\ndart run pdfrx:remove_wasm_modules\ntrap 'dart run pdfrx:remove_wasm_modules --revert' EXIT\nexport DISPLAY=:99\nsudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &\ndocker ps -a\nrm -f /tmp/cloud-test-events.jsonl\nif [ \"${{ matrix.cloud_test_suite }}\" = pdf_export ]; then\n  export APPFLOWY_PDF_TEST_OUTPUT_DIR=\"$RUNNER_TEMP/pdf-cloud-ui-regression/saved-exports\"\n  mkdir -p \"$APPFLOWY_PDF_TEST_OUTPUT_DIR\"\nfi\n\nset +e\nflutter test \\\n  --dart-define=CLOUD_TEST_SUITE=${{ matrix.cloud_test_suite }} \\\n  --dart-define=APPFLOWY_CLOUD_URL=\"$APPFLOWY_CLOUD_URL\" \\\n  integration_test/desktop/cloud/cloud_runner.dart \\\n  -d Linux \\\n  --file-reporter=json:/tmp/cloud-test-events.jsonl \\\n  --coverage 2>&1 | tee /tmp/test_output.txt\n# bash runs with pipefail, so tee cannot hide a failing Flutter exit.\nTEST_EXIT=$?\nset -eo pipefail\n\nif [ \"${{ matrix.cloud_test_suite }}\" = pdf_export ]; then\n  cp /tmp/test_output.txt\
        \ \"$RUNNER_TEMP/pdf-cloud-ui-regression/test.log\"\n  python3 \"$GITHUB_WORKSPACE/.desktop-ci-tools/.github/scripts/run_desktop_pdf_ui_tests.py\" \\\n    --project \"$GITHUB_WORKSPACE/frontend/appflowy_flutter\" \\\n    --output \"$RUNNER_TEMP/pdf-cloud-ui-regression\" \\\n    --verify-cloud-events /tmp/cloud-test-events.jsonl \\\n    --process-status \"$TEST_EXIT\"\nfi\n\nPASS_COUNT=$(grep -c '\u2705' /tmp/test_output.txt || true)\nFAIL_COUNT=$(grep -c '\u274C' /tmp/test_output.txt || true)\n\nif [ \"${{ matrix.cloud_test_suite }}\" != pdf_export ] && [ \"$TEST_EXIT\" -ne 0 ] &&\n  grep -Eq '\U0001F389 [0-9]+ tests passed(, [0-9]+ skipped)?\\.' /tmp/test_output.txt &&\n  grep -q 'unhandled error during finalization of test' /tmp/test_output.txt &&\n  grep -q 'PathNotFoundException: Deletion failed.*flutter_test_listener' /tmp/test_output.txt &&\n  ! grep -q '\u274C.*(failed)' /tmp/test_output.txt; then\n  echo \"::warning::Ignoring Flutter test listener cleanup failure after all\
        \ tests passed\"\n  TEST_EXIT=0\nfi\n\nif [ $TEST_EXIT -eq 0 ]; then\n  echo \"\u2705 All $PASS_COUNT cloud integration tests passed\"\nelse\n  echo \"\u274C $FAIL_COUNT cloud integration test(s) failed, $PASS_COUNT test(s) passed\"\nfi\n\nexit $TEST_EXIT\n"
    - name: Upload exact Cloud runtime manifest
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: desktop-cloud-manifest-flutter-${{ matrix.cloud_test_suite }}
        path: ${{ runner.temp }}/desktop-cloud-manifest.json
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload cloud test output
      if: always()
      timeout-minutes: 3
      uses: actions/upload-artifact@v4
      with:
        name: cloud-test-output-${{ matrix.cloud_test_suite }}-${{ github.run_id }}
        path: |
          /tmp/test_output.txt
          /tmp/cloud-test-events.jsonl
          ${{ runner.temp }}/flutter-prerequisites.log
        if-no-files-found: warn
        retention-days: 7
    - name: Collect Docker logs
      if: failure() || cancelled()
      timeout-minutes: 2
      run: |
        docker ps -a > docker-ps-output.txt
        docker logs appflowy-cloud-premium-appflowy_cloud-1 > appflowy_cloud_logs.txt 2>&1 || true
        docker logs appflowy-cloud-premium-appflowy_worker-1 > appflowy_worker_logs.txt 2>&1 || true
        docker logs appflowy-cloud-premium-minio-1 > minio_logs.txt 2>&1 || true
        docker logs appflowy-cloud-premium-gotrue-1 > gotrue_logs.txt 2>&1 || true
        docker logs appflowy-cloud-premium-nginx-1 > nginx_logs.txt 2>&1 || true
    - name: Upload Docker logs
      if: failure() || cancelled()
      timeout-minutes: 3
      uses: actions/upload-artifact@v4
      with:
        name: cloud-integration-test-logs-${{ matrix.cloud_test_suite }}-${{ github.run_id }}
        path: |
          docker-ps-output.txt
          appflowy_cloud_logs.txt
          appflowy_worker_logs.txt
          minio_logs.txt
          gotrue_logs.txt
          nginx_logs.txt
        retention-days: 1
    - name: Upload PDF cloud UI regression evidence
      if: always() && matrix.cloud_test_suite == 'pdf_export'
      uses: actions/upload-artifact@v4
      with:
        name: desktop-pdf-cloud-ui-regression-${{ github.run_id }}
        path: ${{ runner.temp }}/pdf-cloud-ui-regression
        if-no-files-found: warn
        retention-days: 7
    - name: Publish the Desktop cloud PDF UI result
      if: always() && matrix.cloud_test_suite == 'pdf_export'
      env:
        GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        PDF_JOB_STATUS: ${{ job.status }}
        PDF_GATE_OUTCOME: ${{ steps.cloud-test-run.outcome || 'skipped' }}
      run: |
        python3 .desktop-ci-tools/.github/scripts/desktop_pdf_status.py \
          --workspace frontend/rust-lib --kind cloud_ui --state completed \
          --job-status "$PDF_JOB_STATUS" --gate-outcome "$PDF_GATE_OUTCOME" \
          --gate-result "$RUNNER_TEMP/pdf-cloud-ui-regression/gate-result.json"
