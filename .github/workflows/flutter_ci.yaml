# Temporary diagnostic branch only. The full workflow remains unchanged on the CI source branch.
# Reuses the verified 17f8ce application/native artifact and overlays exactly three test-only files.
name: Flutter-CI targeted revalidation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: "3.41.9"
  RUST_TOOLCHAIN: "1.92.0"
  CARGO_MAKE_VERSION: "0.37.18"
  CLOUD_VERSION: latest-amd64
  # Speed up crate downloads with sparse registry
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Disable incremental compilation in CI (faster clean builds)
  CARGO_INCREMENTAL: "0"

concurrency:
  group: desktop-targeted-revalidation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  cloud_integration_test:
    name: Cloud integration test (${{ matrix.cloud_test_suite }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-latest]
        cloud_test_suite: [database]
        include:
          - os: ubuntu-latest
            flutter_profile: development-linux-x86_64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MINIO_DATA_DIR: /tmp/minio-data
      APPFLOWY_CLOUD_URL: https://localhost
      # Only this job's disposable Compose database; never infer a developer database.
      APPFLOWY_TEST_DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/postgres

    steps:
      - name: Checkout AppFlowy-Cloud-Premium code
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: 6260e7abcb0adc0f04122de66130c26aaaba8254
          path: AppFlowy-Cloud-Premium

      - name: Prepare appflowy cloud env
        working-directory: AppFlowy-Cloud-Premium
        run: |
          # log level
          cp deploy.env .env
          #sed -i 's|RUST_LOG=.*|RUST_LOG=appflowy_cloud=trace,appflowy_collaborate=trace|' .env
          sed -i 's|^FQDN=.*|FQDN=localhost|' .env
          sed -i 's|^SCHEME=.*|SCHEME=https|' .env
          sed -i 's|^WS_SCHEME=.*|WS_SCHEME=wss|' .env
          sed -i 's/GOTRUE_EXTERNAL_GOOGLE_ENABLED=.*/GOTRUE_EXTERNAL_GOOGLE_ENABLED=true/' .env
          sed -i 's|GOTRUE_MAILER_AUTOCONFIRM=.*|GOTRUE_MAILER_AUTOCONFIRM=true|' .env
          sed -i 's|API_EXTERNAL_URL=.*|API_EXTERNAL_URL=https://localhost|' .env
          sed -i 's|AI_OPENAI_API_KEY=.*|AI_OPENAI_API_KEY=${{ secrets.CI_OPENAI_API_KEY }}|' .env
          sed -i 's|APPFLOWY_SPAM_DETECT_ENABLED=.*|APPFLOWY_SPAM_DETECT_ENABLED=false|' .env
          sed -i 's|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=.*|APPFLOWY_DATABASE_BLOB_APPEND_FLUSH_INTERVAL_MS=500|' .env
          sed -i 's|.*APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=.*|APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=https://localhost/minio-api|' .env

          echo '' >> .env
          echo 'APPFLOWY_PAGE_HISTORY_ENABLE=true' >> .env
          echo 'APPFLOWY_FEATURE_RULES_DOMAIN=appflowy.io' >> .env
          echo 'APPFLOWY_INVITE_MIN_ACCOUNT_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_MIN_WORKSPACE_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_HOUR=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_DAY=0' >> .env

          if [ "${{ matrix.cloud_test_suite }}" = "database" ]; then
            # History saves all nine layouts; the captured duplication fixture
            # has eight views. Only this disposable suite needs a larger cap.
            echo 'APPFLOWY_MAX_DASHBOARD_WIDGETS=10' >> .env
          fi

      - name: Verify database fixture Compose capacity
        if: matrix.cloud_test_suite == 'database'
        working-directory: AppFlowy-Cloud-Premium
        run: |
          docker compose -f docker-compose-ci.yml config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          for service in ("appflowy_cloud", "appflowy_worker"):
              actual = services[service]["environment"].get("APPFLOWY_MAX_DASHBOARD_WIDGETS")
              if actual != "10":
                  raise SystemExit(f"{service} must use the ten-view database fixture cap, got {actual!r}")
          print("Cloud and Worker both use the ten-view database fixture cap")
          '

      - name: Trust localhost HTTPS for cloud tests
        working-directory: AppFlowy-Cloud-Premium
        run: |
          # Public Forms require HTTPS. Use a fresh localhost certificate and
          # the runner's trust store so Dart, native HTTP, and WebSockets verify TLS.
          umask 077
          cert_dir=$(mktemp -d "$RUNNER_TEMP/appflowy-ci-tls.XXXXXX")
          trap 'rm -rf "$cert_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=AppFlowy CI Root' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$cert_dir/ca.key" -out "$cert_dir/ca.crt"
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout nginx/ssl/private_key.key -out "$cert_dir/server.csr"
          cat > "$cert_dir/server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1
          EOF
          openssl x509 -req -days 2 -in "$cert_dir/server.csr" \
            -CA "$cert_dir/ca.crt" -CAkey "$cert_dir/ca.key" -CAcreateserial \
            -extfile "$cert_dir/server.ext" -out nginx/ssl/certificate.crt
          chmod 600 nginx/ssl/private_key.key
          sudo install -m 0644 "$cert_dir/ca.crt" \
            /usr/local/share/ca-certificates/appflowy-ci.crt
          sudo update-ca-certificates

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Run Docker-Compose
        working-directory: AppFlowy-Cloud-Premium
        env:
          APPFLOWY_CLOUD_VERSION: ${{ env.CLOUD_VERSION }}
          APPFLOWY_HISTORY_VERSION: ${{ env.CLOUD_VERSION }}
          APPFLOWY_WORKER_VERSION: ${{ env.CLOUD_VERSION }}
          APPFLOWY_ADMIN_FRONTEND_VERSION: ${{ env.CLOUD_VERSION }}
        run: |
          echo "Cleaning up any existing containers..."
          docker compose -f docker-compose-ci.yml down -v --remove-orphans || true
          docker container prune -f || true
          docker volume prune -f || true
          sudo rm -rf /tmp/minio-data || true

          echo "Pulling and starting containers..."
          docker compose -f docker-compose-ci.yml pull
          if [ "${{ matrix.cloud_test_suite }}" = "timeline" ]; then
            # Timeline scenarios use a seeded account and exercise creation on
            # self-hosted Cloud, where it does not require a hosted Pro plan.
            # Build that deployment from the checked-out server source.
            export APPFLOWY_CLOUD_BUILD_FEATURES="self-host-af,commercial-ci,ci-test"
            echo "Building the self-hosted Cloud image for Timeline tests"
            docker compose -f docker-compose-ci.yml build appflowy_cloud
          fi
          docker compose -f docker-compose-ci.yml up -d
          docker ps -a
          docker compose -f docker-compose-ci.yml logs appflowy_cloud

      - name: Record exact runtime image identities
        working-directory: AppFlowy-Cloud-Premium
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          def read(*args):
              return subprocess.check_output(args, text=True).strip()
          result = {'compose_source': read('git', 'rev-parse', 'HEAD'), 'services': {}}
          for service in ('appflowy_cloud', 'appflowy_worker'):
              container = read('docker', 'compose', '-f', 'docker-compose-ci.yml', 'ps', '-q', service)
              assert container, f'Missing runtime container: {service}'
              image_id = read('docker', 'inspect', '--format', '{{.Image}}', container)
              image = json.loads(read('docker', 'image', 'inspect', image_id))[0]
              labels = image.get('Config', {}).get('Labels') or {}
              result['services'][service] = {
                  'container_id': container,
                  'image_id': image['Id'],
                  'repo_digests': image.get('RepoDigests', []),
                  'architecture': image['Architecture'],
                  'source_revision': labels.get('org.opencontainers.image.revision'),
              }
          with open('/tmp/cloud-runtime-image-provenance.json', 'w') as handle:
              json.dump(result, handle, indent=2)
          print(json.dumps(result, indent=2))
          PYCODE

      - name: Wait for appflowy cloud to be ready
        working-directory: AppFlowy-Cloud-Premium
        run: |
          echo "Waiting for services to be ready..."
          for i in {1..60}; do
            if curl --fail --show-error --max-time 5 "$APPFLOWY_CLOUD_URL/api/health"; then
              echo "Health check passed after $((i*5)) seconds"
              exit 0
            fi
            echo "Attempt $i: Health check failed, waiting 5 seconds..."
            sleep 5
          done
          echo "::error::Cloud HTTPS health check timed out"
          exit 1

      - name: Verify database fixture runtime capacity
        if: matrix.cloud_test_suite == 'database'
        run: |
          curl --fail --show-error --max-time 10 \
            -H 'client-version: 0.14.8' -H 'x-platform: app' \
            "$APPFLOWY_CLOUD_URL/api/server-info" | python3 -c '
          import json, sys
          envelope = json.load(sys.stdin)
          if envelope.get("code") != 0 or (envelope.get("data") or {}).get("max_dashboard_widgets") != 10:
              raise SystemExit("Cloud did not advertise the ten-view database fixture cap")
          print("Cloud advertises the ten-view database fixture cap")
          '

      - name: Verify self-hosted Cloud for Timeline tests
        if: matrix.cloud_test_suite == 'timeline'
        working-directory: AppFlowy-Cloud-Premium
        run: |
          curl --fail --show-error --silent "$APPFLOWY_CLOUD_URL/api/server-info" \
            > /tmp/timeline-server-info.json
          python3 - <<'PY'
          import json

          with open('/tmp/timeline-server-info.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          server_info = payload.get('data', payload)
          if server_info.get('self_hosted') is not True:
              raise SystemExit(
                  'Timeline tests require a self-hosted Cloud image; '
                  f"server-info reported self_hosted={server_info.get('self_hosted')!r}"
              )
          print('Timeline Cloud server reports self_hosted=true')
          PY

      - name: Wait for MinIO to be ready
        working-directory: AppFlowy-Cloud-Premium
        run: |
          echo "Waiting for MinIO to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/ready 2>/dev/null; then
              echo "MinIO ready after $((i*3)) seconds"
              break
            fi
            echo "Attempt $i: MinIO not ready, waiting 3 seconds..."
            sleep 3
          done

          # Verify bucket is accessible via S3 API
          echo "Verifying MinIO bucket access..."
          for i in {1..10}; do
            if docker compose -f docker-compose-ci.yml exec -T minio mc ls local/ 2>/dev/null; then
              echo "MinIO bucket listing succeeded"
              exit 0
            fi
            # Fallback: try raw S3 list via curl
            if curl -sf http://localhost:9000/appflowy/ 2>/dev/null; then
              echo "MinIO bucket accessible via HTTP"
              exit 0
            fi
            echo "Attempt $i: Bucket not accessible, waiting 3 seconds..."
            sleep 3
          done
          echo "::warning::MinIO bucket check did not confirm access - dumping MinIO logs"
          docker compose -f docker-compose-ci.yml logs minio

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: 42d336d59743c8a7f94967e0bdf928bbc077f06b
          fetch-depth: 2

      - name: Verify the exact test-only Desktop revision
        env:
          PREPARED_SOURCE: 17f8ce6778f02e50f26abead14536051af626e45
          TARGET_SOURCE: 42d336d59743c8a7f94967e0bdf928bbc077f06b
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          target = os.environ['TARGET_SOURCE']
          prepared = os.environ['PREPARED_SOURCE']
          assert git('rev-parse', 'HEAD') == target, 'Unexpected Desktop checkout'
          subprocess.run(['git', 'merge-base', '--is-ancestor', prepared, target], check=True)
          expected = {
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group.feature',
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group_test.dart',
              'frontend/appflowy_flutter/test/step/the_number_grouping_validation_error_is.dart',
          }
          actual = set(git('diff', '--name-only', prepared, target).splitlines())
          assert actual == expected, f'Unexpected source changes: {actual ^ expected}'
          for line in git('diff', '--numstat', prepared, target).splitlines():
              assert line.split('\t')[:2] == ['1', '1'], f'Unexpected test change: {line}'
          print(f'Verified {target}: only three one-line test changes from prepared {prepared}')
          PYCODE

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}

      - name: Install prerequisites
        working-directory: frontend
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev libepoxy-dev
          sudo apt-get install keybinder-3.0 libnotify-dev libwayland-cursor0 libwayland-client0 libwayland-egl1 unzip liblzma-dev
          sudo apt-get install -y libmpv-dev mpv libasound2-dev
          # Install GStreamer for audioplayers_linux
          # Install libunwind-dev first to resolve dependency issues
          sudo apt-get -y install libunwind-dev
          sudo apt-get -y install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
        shell: bash

      - name: Enable Flutter Desktop
        run: |
          flutter config --enable-linux-desktop
        shell: bash

      - name: Download and verify the immutable prepared Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/AppFlowy-IO/AppFlowy-CI/actions/artifacts/11698020192 > "$RUNNER_TEMP/prepared-artifact.json"
          python3 - "$RUNNER_TEMP/prepared-artifact.json" <<'PYCODE'
          import json, sys
          with open(sys.argv[1]) as handle:
              artifact = json.load(handle)
          assert artifact['id'] == 11698020192
          assert artifact['name'] == '38126067520-ubuntu-latest'
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == 38126067520
          assert artifact['workflow_run']['head_sha'] == '5618248fb1bd09b1e4ae43f1d738ba1d3d66bdd7'
          assert artifact['digest'] == 'sha256:4059813490112eb69b93995dbc1a1ed20bf9c390960af344f37922a8b7fd2ba1'
          print('Verified immutable prepared artifact metadata')
          PYCODE
          gh api repos/AppFlowy-IO/AppFlowy-CI/actions/artifacts/11698020192/zip > "$RUNNER_TEMP/prepared-linux.zip"
          echo "4059813490112eb69b93995dbc1a1ed20bf9c390960af344f37922a8b7fd2ba1  $RUNNER_TEMP/prepared-linux.zip" | sha256sum --check --strict
          unzip -p "$RUNNER_TEMP/prepared-linux.zip" appflowy_flutter.tar.gz > appflowy_flutter.tar.gz

      - name: Uncompressed appflowy_flutter
        run: |
          tar -xf appflowy_flutter.tar.gz

      - name: Restore and verify the three corrected test files
        run: |
          python3 - <<'PYCODE'
          import subprocess
          target = '42d336d59743c8a7f94967e0bdf928bbc077f06b'
          paths = [
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group.feature',
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group_test.dart',
              'frontend/appflowy_flutter/test/step/the_number_grouping_validation_error_is.dart',
          ]
          subprocess.run(['git', 'restore', '--source=' + target, '--worktree', '--', *paths], check=True)
          for path in paths:
              expected = subprocess.check_output(['git', 'rev-parse', target + ':' + path], text=True).strip()
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, f'Test overlay mismatch: {path}'
              print(f'{path}: {actual}')
          print('Verified exact corrected test sources over unchanged prepared application/native artifact')
          PYCODE

      - name: Inspect media_kit native plugin
        working-directory: frontend/appflowy_flutter
        run: |
          find build/linux -name 'libmedia_kit_video_plugin.so' -print -exec ldd {} \; || true
          pkg-config --modversion mpv || true
          pkg-config --modversion epoxy || true

      - name: Install workspace plan fixture client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Flutter integration tests (${{ matrix.cloud_test_suite }})
        # Leave time inside the 60-minute job limit to upload partial results.
        timeout-minutes: 45
        shell: bash
        run: |
          cd frontend/appflowy_flutter
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          trap 'dart run pdfrx:remove_wasm_modules --revert' EXIT
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sudo apt-get install network-manager
          docker ps -a

          set +e
          flutter test \
            --dart-define=CLOUD_TEST_SUITE=${{ matrix.cloud_test_suite }} \
            --dart-define=APPFLOWY_CLOUD_URL="$APPFLOWY_CLOUD_URL" \
            integration_test/desktop/cloud/cloud_runner.dart \
            -d Linux \
            --file-reporter=json:/tmp/cloud-test-events.jsonl \
            --coverage 2>&1 | tee /tmp/test_output.txt
          # bash runs with pipefail, so tee cannot hide a failing Flutter exit.
          TEST_EXIT=$?
          set -eo pipefail

          PASS_COUNT=$(grep -c '✅' /tmp/test_output.txt || true)
          FAIL_COUNT=$(grep -c '❌' /tmp/test_output.txt || true)

          if [ "$TEST_EXIT" -ne 0 ] &&
            grep -Eq '🎉 [0-9]+ tests passed(, [0-9]+ skipped)?\.' /tmp/test_output.txt &&
            grep -q 'unhandled error during finalization of test' /tmp/test_output.txt &&
            grep -q 'PathNotFoundException: Deletion failed.*flutter_test_listener' /tmp/test_output.txt &&
            ! grep -q '❌.*(failed)' /tmp/test_output.txt; then
            echo "::warning::Ignoring Flutter test listener cleanup failure after all tests passed"
            TEST_EXIT=0
          fi

          if [ $TEST_EXIT -eq 0 ]; then
            echo "✅ All $PASS_COUNT cloud integration tests passed"
          else
            echo "❌ $FAIL_COUNT cloud integration test(s) failed, $PASS_COUNT test(s) passed"
          fi

          echo ""
          echo "::group::Failed tests (click to expand)"
          awk '/❌.*\(failed\)/{found=1} found{print} /##\[endgroup\]/ && found{found=0}' /tmp/test_output.txt
          echo "::endgroup::"

          exit $TEST_EXIT

      - name: Upload cloud test output
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: cloud-test-output-${{ matrix.cloud_test_suite }}-${{ github.run_id }}
          path: |
            /tmp/test_output.txt
            /tmp/cloud-test-events.jsonl
            /tmp/cloud-runtime-image-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Collect Docker logs
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          docker ps -a > docker-ps-output.txt
          docker logs appflowy-cloud-premium-appflowy_cloud-1 > appflowy_cloud_logs.txt 2>&1 || true
          docker logs appflowy-cloud-premium-appflowy_worker-1 > appflowy_worker_logs.txt 2>&1 || true
          docker logs appflowy-cloud-premium-minio-1 > minio_logs.txt 2>&1 || true
          docker logs appflowy-cloud-premium-gotrue-1 > gotrue_logs.txt 2>&1 || true
          docker logs appflowy-cloud-premium-nginx-1 > nginx_logs.txt 2>&1 || true

      - name: Upload Docker logs
        if: failure() || cancelled()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: cloud-integration-test-logs-${{ matrix.cloud_test_suite }}-${{ github.run_id }}
          path: |
            docker-ps-output.txt
            appflowy_cloud_logs.txt
            appflowy_worker_logs.txt
            minio_logs.txt
            gotrue_logs.txt
            nginx_logs.txt
          retention-days: 1

  integration_test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        test_number: [16]
        include:
          - os: ubuntu-latest
            target: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ref: 42d336d59743c8a7f94967e0bdf928bbc077f06b
          fetch-depth: 2

      - name: Verify the exact test-only Desktop revision
        env:
          PREPARED_SOURCE: 17f8ce6778f02e50f26abead14536051af626e45
          TARGET_SOURCE: 42d336d59743c8a7f94967e0bdf928bbc077f06b
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          target = os.environ['TARGET_SOURCE']
          prepared = os.environ['PREPARED_SOURCE']
          assert git('rev-parse', 'HEAD') == target, 'Unexpected Desktop checkout'
          subprocess.run(['git', 'merge-base', '--is-ancestor', prepared, target], check=True)
          expected = {
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group.feature',
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group_test.dart',
              'frontend/appflowy_flutter/test/step/the_number_grouping_validation_error_is.dart',
          }
          actual = set(git('diff', '--name-only', prepared, target).splitlines())
          assert actual == expected, f'Unexpected source changes: {actual ^ expected}'
          for line in git('diff', '--numstat', prepared, target).splitlines():
              assert line.split('\t')[:2] == ['1', '1'], f'Unexpected test change: {line}'
          print(f'Verified {target}: only three one-line test changes from prepared {prepared}')
          PYCODE

      - name: Install Rust toolchain
        id: rust_toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          override: true
          profile: minimal

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@${{ env.CARGO_MAKE_VERSION }}

      - name: Install prerequisites
        working-directory: frontend
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo wget -qO /etc/apt/sources.list.d/dart_stable.list https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_stable.list
          sudo apt-get update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev libepoxy-dev
          sudo apt-get install keybinder-3.0 libnotify-dev libwayland-cursor0 libwayland-client0 libwayland-egl1 unzip liblzma-dev network-manager
          sudo apt-get install -y libmpv-dev mpv libasound2-dev
          # Install GStreamer for audioplayers_linux
          # Install libunwind-dev first to resolve dependency issues
          sudo apt-get -y install libunwind-dev
          sudo apt-get -y install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
        shell: bash

      - name: Enable Flutter Desktop
        run: |
          flutter config --enable-linux-desktop
        shell: bash

      - name: Download and verify the immutable prepared Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/AppFlowy-IO/AppFlowy-CI/actions/artifacts/11698020192 > "$RUNNER_TEMP/prepared-artifact.json"
          python3 - "$RUNNER_TEMP/prepared-artifact.json" <<'PYCODE'
          import json, sys
          with open(sys.argv[1]) as handle:
              artifact = json.load(handle)
          assert artifact['id'] == 11698020192
          assert artifact['name'] == '38126067520-ubuntu-latest'
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == 38126067520
          assert artifact['workflow_run']['head_sha'] == '5618248fb1bd09b1e4ae43f1d738ba1d3d66bdd7'
          assert artifact['digest'] == 'sha256:4059813490112eb69b93995dbc1a1ed20bf9c390960af344f37922a8b7fd2ba1'
          print('Verified immutable prepared artifact metadata')
          PYCODE
          gh api repos/AppFlowy-IO/AppFlowy-CI/actions/artifacts/11698020192/zip > "$RUNNER_TEMP/prepared-linux.zip"
          echo "4059813490112eb69b93995dbc1a1ed20bf9c390960af344f37922a8b7fd2ba1  $RUNNER_TEMP/prepared-linux.zip" | sha256sum --check --strict
          unzip -p "$RUNNER_TEMP/prepared-linux.zip" appflowy_flutter.tar.gz > appflowy_flutter.tar.gz

      - name: Uncompressed appflowy_flutter
        run: tar -xf appflowy_flutter.tar.gz
        shell: bash

      - name: Restore and verify the three corrected test files
        run: |
          python3 - <<'PYCODE'
          import subprocess
          target = '42d336d59743c8a7f94967e0bdf928bbc077f06b'
          paths = [
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group.feature',
              'frontend/appflowy_flutter/integration_test/desktop/bdd/database/layout_and_group/layout_and_group_test.dart',
              'frontend/appflowy_flutter/test/step/the_number_grouping_validation_error_is.dart',
          ]
          subprocess.run(['git', 'restore', '--source=' + target, '--worktree', '--', *paths], check=True)
          for path in paths:
              expected = subprocess.check_output(['git', 'rev-parse', target + ':' + path], text=True).strip()
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == expected, f'Test overlay mismatch: {path}'
              print(f'{path}: {actual}')
          print('Verified exact corrected test sources over unchanged prepared application/native artifact')
          PYCODE

      - name: Inspect media_kit native plugin
        working-directory: frontend/appflowy_flutter
        run: |
          find build/linux -name 'libmedia_kit_video_plugin.so' -print -exec ldd {} \; || true
          pkg-config --modversion mpv || true
          pkg-config --modversion epoxy || true
        shell: bash

      - name: Prepare PDFium for Linux integration tests
        run: |
          set -euo pipefail
          PDFIUM_DIR="$RUNNER_TEMP/pdfium"
          PDFIUM_ARCHIVE="$RUNNER_TEMP/pdfium-linux-x64.tgz"
          mkdir -p "$PDFIUM_DIR"
          curl -L \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz" \
            -o "$PDFIUM_ARCHIVE"
          tar -xzf "$PDFIUM_ARCHIVE" -C "$PDFIUM_DIR" lib/libpdfium.so
          echo "APPFLOWY_PDFIUM_MODULE_PATH=$PDFIUM_DIR/lib/libpdfium.so" >> "$GITHUB_ENV"
          ls -lh "$PDFIUM_DIR/lib/libpdfium.so"
        shell: bash

      - name: Run Flutter integration tests
        # Leave time inside the 60-minute job limit to upload partial results.
        timeout-minutes: 45
        shell: bash
        run: |
          cd frontend/appflowy_flutter
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          trap 'dart run pdfrx:remove_wasm_modules --revert' EXIT
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sudo apt-get install network-manager

          set +e
          flutter test \
            integration_test/desktop_runner_${{ matrix.test_number }}.dart \
            -d Linux \
            --file-reporter=json:/tmp/desktop-test-events.jsonl \
            --coverage 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          set -eo pipefail

          PASS_COUNT=$(grep -c '✅' /tmp/test_output.txt || true)
          FAIL_COUNT=$(grep -c '❌' /tmp/test_output.txt || true)

          if [ "$TEST_EXIT" -ne 0 ] &&
            grep -Eq '🎉 [0-9]+ tests passed(, [0-9]+ skipped)?\.' /tmp/test_output.txt &&
            grep -q 'unhandled error during finalization of test' /tmp/test_output.txt &&
            grep -q 'PathNotFoundException: Deletion failed.*flutter_test_listener' /tmp/test_output.txt &&
            ! grep -q '❌.*(failed)' /tmp/test_output.txt; then
            echo "::warning::Ignoring Flutter test listener cleanup failure after all tests passed"
            TEST_EXIT=0
          fi

          if [ $TEST_EXIT -eq 0 ]; then
            echo "✅ All $PASS_COUNT integration tests passed"
          else
            echo "❌ $FAIL_COUNT integration test(s) failed, $PASS_COUNT test(s) passed"
          fi

          echo ""
          echo "::group::Failed tests (click to expand)"
          awk '/❌.*\(failed\)/{found=1} found{print} /##\[endgroup\]/ && found{found=0}' /tmp/test_output.txt
          echo "::endgroup::"

          exit $TEST_EXIT

      - name: Upload desktop test output
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-output-${{ matrix.test_number }}-${{ github.run_id }}
          path: |
            /tmp/test_output.txt
            /tmp/desktop-test-events.jsonl
          if-no-files-found: warn
          retention-days: 7
