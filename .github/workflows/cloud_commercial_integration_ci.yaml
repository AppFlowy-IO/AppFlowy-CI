name: AppFlowy-Cloud Commercial Integrations
run-name: >-
  [ci-v2 source=${{ github.event_name == 'pull_request' && github.repository || 'AppFlowy-IO/AppFlowy-Cloud-Premium' }}
  pr=${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && inputs.pr_number || (github.event.client_payload.event_type == 'pr_opened' || github.event.client_payload.event_type == 'pr_sync') && github.event.client_payload.pr_number || 'none' }}
  parent=none]
  ${{ github.workflow }}
on:
  repository_dispatch:
    types: [commercial-cloud-integration-ci]
  workflow_dispatch:
    inputs:
      pr_ref:
        description: Exact private Cloud commit SHA
        required: true
        type: string
      pr_number:
        description: Private Cloud PR number for run discovery and concurrency
        required: true
        type: string
      image_workflow_ref:
        description: Private builder branch for paired manual validation
        type: string
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && format('manual-{0}', github.ref) || github.event.client_payload.event_type == 'push' && 'push' || 'validation' }}-${{ github.event.client_payload.pr_number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  LOCALHOST_URL: http://localhost
  LOCALHOST_WS: ws://localhost/ws/v1
  LOCALHOST_WS_V2: ws://localhost/ws/v2
  APPFLOWY_REDIS_URI: redis://redis:6379
  APPFLOWY_AI_REDIS_URL: redis://redis:6379
  LOCALHOST_GOTRUE: http://localhost/gotrue
  POSTGRES_PASSWORD: password
  # Both Compose interpolation and the real HTTP test use the disabled deployment setting.
  APPFLOWY_DATABASE_AUTOMATIONS_ENABLED: "false"
  DATABASE_URL: postgres://postgres:password@localhost:5432/postgres
  SQLX_OFFLINE: true
  RUST_TOOLCHAIN: "1.98.1"
  CLOUD_VERSION: "latest-amd64"
  # Speed up crate downloads with sparse registry
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Faster for git dependencies
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # Disable incremental compilation in CI (faster clean builds)
  CARGO_INCREMENTAL: "0"
  # Native contracts share runner disk with the full Docker stack.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  setup:
    name: Resolve commercial shards and wait for the private image build
    runs-on: ubuntu-latest
    outputs:
      test_services: ${{ steps.shards.outputs.services }}
      cloud_sha: ${{ steps.source.outputs.sha }}
      image_run_id: ${{ steps.images.outputs.run_id }}
      lock_artifact: ${{ steps.images.outputs.lock_artifact }}
    steps:
      - name: Validate manual Cloud revision
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_REF: ${{ inputs.pr_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "$PR_REF" =~ ^[a-f0-9]{40}$ && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          persist-credentials: false
          ref: ${{ github.event.client_payload.pr_ref || inputs.pr_ref }}

      - name: Record Cloud test source
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          printf 'AF_TEST_SOURCE_SHA=%s\n' "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Select commercial CI shards for this Cloud revision
        id: shards
        shell: bash
        run: |
          services='["appflowy_cloud_commercial","appflowy_cloud_whitelist"]'
          if [[ -e script/ci/license_outage_fixture.py || -e tests/commercial_test/billing_outage.rs || -e script/ci/run_license_outage_ci.py ]]; then
            test -f script/ci/license_outage_fixture.py && test -f tests/commercial_test/billing_outage.rs && test -f script/ci/run_license_outage_ci.py || {
              echo "::error::Cloud's billing outage contract is incomplete"
              exit 1
            }
            services='["appflowy_cloud_commercial","appflowy_cloud_whitelist","appflowy_cloud_license_outage"]'
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"

      - name: Check out CI image request tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false
      - name: Request the private commercial image build
        id: images
        env:
          GH_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number || '' }}
          IMAGE_WORKFLOW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.image_workflow_ref || 'main' }}
          COMMERCIAL_IMAGES: 'true'
          LOCK_PUBLISHED_IMAGES: 'true'
        run: python3 -I -B ci-tools/.github/scripts/request_image_build.py

  test:
    name: Integration Tests (${{ matrix.test_service }})
    # The outage shard runs the Cloud binary copied from its Ubuntu 24.04 image.
    runs-on: ${{ matrix.test_service == 'appflowy_cloud_license_outage' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    needs: setup
    timeout-minutes: ${{ matrix.test_service == 'appflowy_cloud_license_outage' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        test_service: ${{ fromJSON(needs.setup.outputs.test_services) }}
        include:
          # Commercial tests (billing, self-host)
          - test_service: "appflowy_cloud_commercial"
            test_modules: "commercial_test"
          # Whitelist tests (isolated — these toggle GoTrue global state)
          - test_service: "appflowy_cloud_whitelist"
            test_modules: "whitelist"
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          persist-credentials: false
          ref: ${{ needs.setup.outputs.cloud_sha }}

      - name: Record Cloud test source
        run: printf 'AF_TEST_SOURCE_SHA=%s\n' "$(git rev-parse HEAD)"

      - name: Checkout CI contract helpers
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-CI
          ref: ${{ github.workflow_sha }}
          path: ci-tools
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.6
        continue-on-error: true

      - name: Configure sccache
        id: sccache-config
        if: steps.sccache.outcome == 'success'
        run: |
          # Unset RUSTC_WRAPPER first (sccache-action sets it automatically)
          echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
          # Stop any existing sccache server
          sccache --stop-server 2>/dev/null || true
          # Test if sccache can actually connect to GitHub cache
          export SCCACHE_GHA_ENABLED=true
          export RUSTC_WRAPPER=
          if timeout 10 sccache --start-server 2>&1; then
            if timeout 5 sccache --show-stats 2>&1; then
              echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
              echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
              echo "sccache_enabled=true" >> $GITHUB_OUTPUT
              echo "✓ sccache is available and configured"
            else
              sccache --stop-server 2>/dev/null || true
              echo "sccache_enabled=false" >> $GITHUB_OUTPUT
              echo "⚠ sccache stats failed, proceeding without it"
            fi
          else
            echo "sccache_enabled=false" >> $GITHUB_OUTPUT
            echo "⚠ sccache server startup failed, proceeding without it"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "AppFlowy-Cloud"

      - name: Download private images for this shard
        uses: actions/download-artifact@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          run-id: ${{ needs.setup.outputs.image_run_id }}
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          pattern: ${{ matrix.test_service == 'appflowy_cloud_license_outage' && 'commercial-cloud-images' || 'commercial-*-images' }}
          merge-multiple: true
          path: ${{ runner.temp }}/private-commercial-images

      - name: Load the local images
        env:
          TEST_SERVICE: ${{ matrix.test_service }}
        working-directory: ${{ runner.temp }}/private-commercial-images
        run: |
          services=(appflowy_cloud)
          if [[ "$TEST_SERVICE" != appflowy_cloud_license_outage ]]; then
            services+=(appflowy_worker appflowy_search appflowy_mcp appflowy_ai)
          fi
          for service in "${services[@]}"; do
            gzip -dc "$service.tar.gz" | docker load --quiet >/dev/null 2>&1
            rm -- "$service.tar.gz"
          done

      - name: Remove downloaded image archives
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/private-commercial-images"

      - name: Download the private dependency manifest
        uses: actions/download-artifact@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Cloud-Premium
          run-id: ${{ needs.setup.outputs.image_run_id }}
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          name: ${{ needs.setup.outputs.lock_artifact }}
          path: ${{ runner.temp }}/private-dependencies

      - name: Copy and rename deploy.env to .env
        run: cp deploy.env .env

      - name: Replace values in .env
        run: |
          # log level
          sed -i 's|RUST_LOG=.*|RUST_LOG='appflowy_cloud=trace,appflowy_worker=trace,database=trace,indexer=trace'|' .env
          # GoTrue has a separate mailer from appflowy_cloud. Keep confirmation enabled so CI
          # exercises production-like repeated-signup behavior, but route all mail to Mailpit.
          # Mailpit does not require authentication. Leaving credentials populated makes
          # Go's SMTP client reject AUTH over this intentionally plaintext CI connection.
          sed -i 's|GOTRUE_SMTP_HOST=.*|GOTRUE_SMTP_HOST=mailpit|' .env
          sed -i 's|GOTRUE_SMTP_PORT=.*|GOTRUE_SMTP_PORT=1025|' .env
          sed -i 's|GOTRUE_SMTP_USER=.*|GOTRUE_SMTP_USER=|' .env
          sed -i 's|GOTRUE_SMTP_PASS=.*|GOTRUE_SMTP_PASS=|' .env
          sed -i 's|GOTRUE_SMTP_ADMIN_EMAIL=.*|GOTRUE_SMTP_ADMIN_EMAIL=notify@appflowy.io|' .env
          sed -i 's|GOTRUE_EXTERNAL_GOOGLE_ENABLED=.*|GOTRUE_EXTERNAL_GOOGLE_ENABLED=true|' .env
          sed -i 's|GOTRUE_MAILER_AUTOCONFIRM=.*|GOTRUE_MAILER_AUTOCONFIRM=false|' .env
          sed -i 's|API_EXTERNAL_URL=http://your-host/gotrue|API_EXTERNAL_URL=http://localhost/gotrue|' .env
          sed -i 's|GOTRUE_RATE_LIMIT_EMAIL_SENT=100|GOTRUE_RATE_LIMIT_EMAIL_SENT=1000|' .env
          sed -i 's|APPFLOWY_MAILER_SMTP_USERNAME=.*|APPFLOWY_MAILER_SMTP_USERNAME=${{ secrets.CI_GOTRUE_SMTP_USER }}|' .env
          sed -i 's|APPFLOWY_MAILER_SMTP_PASSWORD=.*|APPFLOWY_MAILER_SMTP_PASSWORD=${{ secrets.CI_GOTRUE_SMTP_PASS }}|' .env
          # Route outbound appflowy_cloud mail through the mailpit sidecar
          # (added to docker-compose-ci.yml) so the email_delivery_* tests in
          # commercial_test can assert delivery via mailpit's HTTP API. The
          # override only activates because the image was built with
          # `--features test-mailer` above. `mailpit` is the service name on
          # the shared docker-compose network.
          echo 'APPFLOWY_MAILER_TEST_MODE=true' >> .env
          echo 'APPFLOWY_MAILER_TEST_SMTP_HOST=mailpit' >> .env
          echo 'APPFLOWY_MAILER_TEST_SMTP_PORT=1025' >> .env

          sed -i 's|AI_OPENAI_API_KEY=.*|AI_OPENAI_API_KEY=${{ secrets.CI_OPENAI_API_KEY }}|' .env
          sed -i 's|AI_OPENAI_API_SUMMARY_MODEL=.*|AI_OPENAI_API_SUMMARY_MODEL="gpt-5-mini"|' .env
          sed -i 's|APPFLOWY_EMBEDDING_CHUNK_SIZE=.*|APPFLOWY_EMBEDDING_CHUNK_SIZE=500|' .env
          sed -i 's|APPFLOWY_EMBEDDING_CHUNK_OVERLAP=.*|APPFLOWY_EMBEDDING_CHUNK_OVERLAP=50|' .env
          sed -i 's|ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${{ secrets.CI_AI_ANTHROPIC_API_KEY }}|' .env

          sed -i 's|AI_APPFLOWY_HOST=.*|AI_APPFLOWY_HOST=http://localhost|' .env
          sed -i 's|APPFLOWY_WEB_URL=.*|APPFLOWY_WEB_URL=http://localhost:3000|' .env
          sed -i 's|.*APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=.*|APPFLOWY_S3_PRESIGNED_URL_ENDPOINT=http://localhost/minio-api|' .env
          sed -i 's|APPFLOWY_SPAM_USER_DETECT_THRESHOLD=.*|APPFLOWY_SPAM_USER_DETECT_THRESHOLD=1|' .env

          # Ensure there's a newline at the end of .env before adding new variables
          echo "" >> .env
          echo 'APPFLOWY_CLOUD_BILLING_STRIPE_API_SECRET_KEY=${{ secrets.CI_APPFLOWY_CLOUD_BILLING_STRIPE_API_SECRET_KEY }}' >> .env
          echo 'APPFLOWY_CLOUD_BILLING_STRIPE_WEBHOOK_URL=${{ secrets.CI_APPFLOWY_CLOUD_BILLING_STRIPE_WEBHOOK_URL }}' >> .env
          echo 'APPFLOWY_BILLING_ENDPOINT_ID=${{ secrets.CI_APPFLOWY_BILLING_ENDPOINT_ID }}' >> .env
          echo 'APPFLOWY_BILLING_SIGNING_SECRET=${{ secrets.CI_APPFLOWY_BILLING_SIGNING_SECRET }}' >> .env
          echo 'APPFLOWY_SELF_HOST_BILLING_URL=http://appflowy_billing:4242' >> .env
          if [ -f nginx/api-limits-self-host-ci.conf ]; then
            echo 'APPFLOWY_CI_API_LIMITS_NGINX_CONFIG=./nginx/api-limits-self-host-ci.conf' >> .env
          fi
          echo 'APPFLOWY_INVITE_MIN_ACCOUNT_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_MIN_WORKSPACE_AGE_SECS=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_HOUR=0' >> .env
          echo 'APPFLOWY_INVITE_RATE_LIMIT_PER_DAY=0' >> .env

        shell: bash

      - name: Configure GoTrue for whitelist tests
        if: matrix.test_service == 'appflowy_cloud_whitelist'
        run: |
          # Whitelist sign-up tests require sign-up enabled and the
          # before-user-created hook so the gateway can vet the address.
          sed -i '/^GOTRUE_DISABLE_SIGNUP=/d' .env
          sed -i '/^GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED=/d' .env
          echo 'GOTRUE_DISABLE_SIGNUP=false' >> .env
          echo 'GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED=true' >> .env
        shell: bash

      - name: Update Nginx Configuration
        # the wasm-pack headless tests will run on random ports, so we need to allow all origins
        run: sed -i 's/http:\/\/127\.0\.0\.1:8000/http:\/\/127.0.0.1/g' nginx/nginx.conf

      - name: Prepare published services with temporary registry credentials
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          TEST_SERVICE: ${{ matrix.test_service }}
        run: |
          services=()
          if [[ "$TEST_SERVICE" == appflowy_cloud_license_outage ]]; then
            services=(gotrue minio appflowy_billing)
            if ! grep -Fq APPFLOWY_CI_DEPENDENCY_LOCK script/ci/run_license_outage_ci.py; then
              services=(--compose-tags "${services[@]}")
            fi
          fi
          python3 -I -B ci-tools/.github/scripts/published_cloud_images.py \
            --lock "$RUNNER_TEMP/private-dependencies/published-images.json" "${services[@]}"

      - name: Run Docker-Compose
        if: matrix.test_service != 'appflowy_cloud_license_outage'
        run: |
          export APPFLOWY_CLOUD_VERSION=${{ env.CLOUD_VERSION }}
          export APPFLOWY_WORKER_VERSION=${{ env.CLOUD_VERSION }}
          export APPFLOWY_SEARCH_VERSION=${{ env.CLOUD_VERSION }}
          export APPFLOWY_MCP_VERSION=${{ env.CLOUD_VERSION }}
          export APPFLOWY_ADMIN_FRONTEND_VERSION=${{ env.CLOUD_VERSION }}
          export APPFLOWY_AI_VERSION=${{ env.CLOUD_VERSION }}
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_commercial" ]; then
            export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}authentik"
          fi
          compose=(docker compose -f docker-compose-ci.yml -f "$RUNNER_TEMP/private-dependencies/published-images.json")
          "${compose[@]}" down >/dev/null 2>&1
          "${compose[@]}" up --no-build -d >/dev/null 2>&1

      - name: Wait for services to be ready
        if: matrix.test_service != 'appflowy_cloud_license_outage'
        run: |
          echo "Waiting for services to be ready..."
          timeout 300 bash -c 'until curl -f http://localhost/api/health 2>/dev/null; do sleep 5; done' || echo "Health check timeout - proceeding anyway"

      - name: Wait for Authentik
        if: matrix.test_service == 'appflowy_cloud_commercial'
        run: |
          echo "Waiting for Authentik..."
          timeout 300 bash -c 'until curl -fsS http://localhost:9010/-/health/ready/ >/dev/null; do sleep 3; done'
          echo "Authentik ready."

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Verify paid access through a Billing outage and Cloud restart
        if: matrix.test_service == 'appflowy_cloud_license_outage'
        env:
          APPFLOWY_CLOUD_VERSION: ${{ env.CLOUD_VERSION }}
          COMMERCIAL_LICENSE_OUTAGE_SHARD: "1"
          APPFLOWY_CI_DEPENDENCY_LOCK: ${{ runner.temp }}/private-dependencies/published-images.json
          COMPOSE_PROGRESS: quiet
        run: python3 -B script/ci/run_license_outage_ci.py

      - name: Run real self-host presentation contracts
        if: matrix.test_service == 'appflowy_cloud_commercial'
        env:
          APPFLOWY_PRESENTATION_COMMERCIAL_OWNED_FIXTURE: "1"
          APPFLOWY_PRESENTATION_TEST_AI_URL: http://localhost:5001
        run: python3 -B ci-tools/.github/scripts/commercial_presentation_runner.py --source "$GITHUB_WORKSPACE"

      - name: Run SCIM identity recovery contracts
        if: matrix.test_service == 'appflowy_cloud_commercial'
        run: python3 -B ci-tools/.github/scripts/commercial_scim_runner.py --source "$GITHUB_WORKSPACE"

      - name: Verify all disabled database automation routes over HTTP
        if: matrix.test_service == 'appflowy_cloud_commercial'
        run: bash ci-tools/.github/scripts/commercial_automation_gate.sh

      - name: Run Tests
        if: matrix.test_service != 'appflowy_cloud_license_outage'
        env:
          APPFLOWY_MCP_TEST_BASE_URL: http://localhost:8002
        run: |
          set -e
          echo "Running tests for ${{ matrix.test_service }}"
          if [ "${{ matrix.test_service }}" = "appflowy_cloud_whitelist" ]; then
            # Whitelist tests run in isolation — they toggle GoTrue global state
            for module in ${{ matrix.test_modules }}; do
              echo "==> Testing module: ${module}"
              RUST_LOG="info" DISABLE_CI_TEST_LOG="true" cargo test --locked \
                --features=commercial-ci "${module}" \
                -- --skip stress_test --test-threads=1
            done
          else
            # Skip whitelist tests — they run in the dedicated whitelist group
            for module in ${{ matrix.test_modules }}; do
              echo "==> Testing module: ${module}"
              RUST_LOG="info" DISABLE_CI_TEST_LOG="true" cargo test --locked \
                --features=commercial-ci "${module}" \
                -- --skip stress_test --skip whitelist --skip commercial_test::presentation_test:: \
                --skip commercial_test::scim_test::identity_recovery:: --test-threads=1
            done
          fi

      - name: Test Server Info Endpoint
        if: matrix.test_service == 'appflowy_cloud_commercial'
        run: |
          # Make request to server-info endpoint and capture response
          response=$(curl -s http://localhost/api/server-info)

          if [ $? -ne 0 ]; then
            echo "Failed to connect to server-info endpoint"
            exit 1
          fi

          echo "Server info response: $response"
          # Extract self_hosted field and assert it's true
          self_hosted=$(echo "$response" | jq -r '.data.self_hosted')
          if [ "$self_hosted" != "true" ]; then
            echo "ERROR: self_hosted field is '$self_hosted', expected 'true'"
            exit 1
          fi

          echo "✓ Server info test passed: self_hosted is true"

      - name: Show sccache stats
        if: always() && steps.sccache-config.outputs.sccache_enabled == 'true'
        run: sccache --show-stats || true

      - name: Report commercial container status
        if: failure() && matrix.test_service != 'appflowy_cloud_license_outage'
        run: docker ps -a --format '{{.Names}} {{.Status}}'
